    /* Cell shading reads as scoreboard data, not decoration: desaturated and
       cool, the fill and the figure carrying it between them.

       NO LEFT RULE. It used to draw a 3px bar down the left edge of every
       settled cell. In the middle of the board that bar landed on top of the
       divider between one game and the next and passed for part of it, but the
       first game column has no divider to its left - the one after the points
       was deliberately removed - so there the bar stood on its own and read as a
       stray line fencing the scores off from the standings. It only appeared
       once a game went final, which is why it turned up out of nowhere.

       Nothing is lost by dropping it. The fill and the text are already green or
       red; the bar was a third telling of the same fact. What separates a
       settled cell from a live one is that the live one breathes - that is the
       distinction that actually needed carrying, and it does not need an edge. */
    .pick-win{background:rgba(30,138,86,.20);color:#7fe3ac}
    .pick-loss{background:rgba(120,32,38,.20);color:#e08d93}
    .pick-empty{color:#8b9099}


    /* LIVE CELLS BREATHE. SETTLED ONES DO NOT.
       That is the whole difference between "this is in your points" and "this
       game is still going", and it is carried by motion rather than by colour -
       which matters because a blowout in the third quarter shades exactly as
       hard as a final, so the green cannot tell you which is which. A cell that
       is still moving has not been counted.

       --cover-i is how settled the cover is, 0 at kickoff to 1 once it is
       decided. --cover-pulse rides on top of it, 0.82 to 1 and back over six
       seconds - a shimmer you notice out of the corner of an eye, not a throb. Registering it with @property is what makes it animatable at all;
       where that is unsupported the fallback of 1 leaves the shading static,
       which is simply what it was before.

       No left rule here either, and now none on a settled cell - only the fill
       differs, and only motion says which of the two states it is in. */
    @property --cover-pulse { syntax: '<number>'; inherits: false; initial-value: 1; }
    @keyframes cover-breathe{
      0%,100%{ --cover-pulse: .82 }
      50%    { --cover-pulse: 1 }
    }
    .pick-cover, .pick-nocover{ animation: cover-breathe 6s ease-in-out infinite; }
    .pick-cover{
      background:rgba(30,138,86,calc(var(--cover-i,0) * var(--cover-pulse,1) * .26));
    }
    .pick-nocover{
      background:rgba(120,32,38,calc(var(--cover-i,0) * var(--cover-pulse,1) * .26));
    }
    @media (prefers-reduced-motion: reduce){
      .pick-cover, .pick-nocover{ animation: none; --cover-pulse: .9; }
    }

    /* Backdoor watch: fourth quarter, and a field goal flips the cover. Declared
       after the two above so it wins the fill.

       An amber breath of that same fill - no rule, for the same reason nothing
       else on this board has one any more. Softened alongside the live cells but
       kept at less than half their cycle: a knife edge should read as more
       urgent than the cell beside it, and the tempo is what says so. */
    .pick-backdoor{animation:backdoor 2.4s ease-in-out infinite}
    @keyframes backdoor{
      0%,100%{background:rgba(190,120,10,.20)}
      50%    {background:rgba(190,120,10,.07)}
    }
    /* The pulse is the alarm, so if motion is unwelcome the colour has to carry
       it alone rather than the cell just going quiet. */
    @media (prefers-reduced-motion: reduce){
      .pick-backdoor{animation:none;background:rgba(190,120,10,.24)}
    }

    /* Nobody else took this side. Outline rather than fill, so it stacks with
       whichever of the five states above the cell is already wearing. */
    .pick-lonely{outline:1px solid rgba(233,185,73,.6);outline-offset:-3px}

    /* --- Pick reveal ------------------------------------------------------ */
    /* A centred stack rather than a row: the clock is the point, so it gets to be
       the biggest thing on screen, and centring means one layout works at 390px
       and 1400px without the pieces wrapping into each other. */
    .reveal-banner{
      position:relative; overflow:hidden;
      margin-bottom:.75rem; padding:.85rem 1rem 1rem;
      text-align:center;
      background:
        radial-gradient(120% 140% at 50% 0%, rgba(255,192,46,.13), transparent 70%),
        linear-gradient(180deg, rgba(20,20,22,.9), rgba(12,12,14,.9));
      border:1px solid rgba(255,192,46,.28);
      border-top:2px solid var(--led-amber);
    }
    /* Same LED pitch as the jumbotron, so it reads as part of the same board. */
    .reveal-banner::before{
      content:""; position:absolute; inset:0; pointer-events:none;
      background-image:radial-gradient(circle, var(--panel-dot) 22%, transparent 23%);
      background-size:4px 4px;
    }
    .reveal-banner > *{ position:relative; z-index:1; }

    .reveal-top{

    .reveal-dot{

    @keyframes reveal-pulse{0%,100%{opacity:1}50%{opacity:.2}}

    .reveal-clock{

      color:var(--led-amber);

    }
    .reveal-clock .cd-n{ margin-left:.18em; }
    .reveal-clock .cd-n:first-child{ margin-left:0; }
    .reveal-clock .cd-u{

    .reveal-clock.is-long{ font-size:clamp(2rem, 9.5vw, 3.1rem); letter-spacing:0; }

    .reveal-sub{

    }
    .reveal-sub:empty{ display:none; }

    /* Week 0 only. The season opener gets its own treatment - a gold marquee with

    .reveal-eyebrow{
      font-family:'Teko','Oswald',sans-serif; font-weight:700;
      font-size:1rem; line-height:1; letter-spacing:.2em; text-transform:uppercase;

    }
    .reveal-banner.is-opener{

    }
    .reveal-banner.is-opener .reveal-clock{ font-size:clamp(3.2rem, 15vw, 5rem); }
    .reveal-banner.is-opener::after{
      content:""; position:absolute; top:0; bottom:0; left:-45%; width:45%;
      pointer-events:none; z-index:0;
      background:linear-gradient(90deg, transparent, rgba(255,225,150,.22), transparent);
      animation:opener-sweep 3.4s ease-in-out infinite;
    }
    @keyframes opener-sweep{ 0%{left:-45%} 62%{left:100%} 100%{left:100%} }
    @media (prefers-reduced-motion: reduce){
      .reveal-banner.is-opener::after{ animation:none; opacity:0; }
    }

    /* Under an hour it warms up; under five minutes it goes red and starts
       breathing, so a glance tells you how close you are. */
    .reveal-banner.is-urgent{
      background:
        radial-gradient(120% 140% at 50% 0%, rgba(255,140,40,.16), transparent 70%),
        linear-gradient(180deg, rgba(22,18,16,.9), rgba(13,11,10,.9));
      border-color:rgba(255,140,40,.4); border-top-color:#ff9a2e;
    }
    .reveal-banner.is-urgent .reveal-clock{
      color:#ff9a2e; text-shadow:0 0 10px rgba(255,154,46,.5), 0 0 30px rgba(255,154,46,.2);
    }
    .reveal-banner.is-urgent .reveal-dot{ background:#ff9a2e; box-shadow:0 0 8px rgba(255,154,46,.9); }

    .reveal-banner.is-imminent{
      background:
        radial-gradient(120% 140% at 50% 0%, rgba(255,70,70,.18), transparent 70%),
        linear-gradient(180deg, rgba(24,14,14,.92), rgba(14,10,10,.92));
      border-color:rgba(255,70,70,.45); border-top-color:#ff5757;
    }
    .reveal-banner.is-imminent .reveal-clock{
      color:#ff6b6b; text-shadow:0 0 12px rgba(255,107,107,.6), 0 0 34px rgba(255,107,107,.25);
      animation:reveal-throb 1s ease-in-out infinite;
    }
    .reveal-banner.is-imminent .reveal-dot{ background:#ff5757; box-shadow:0 0 10px rgba(255,87,87,1); }
    @keyframes reveal-throb{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

    /* The board surges when the picks land, like a panel repainting. */
    @keyframes jumbo-surge{
      0%   { filter:brightness(1); }
      12%  { filter:brightness(2.4); }
      28%  { filter:brightness(1.05); }
      42%  { filter:brightness(1.8); }
      100% { filter:brightness(1); }
    }
    .jumbotron-header.jumbo-flash{ animation:jumbo-surge .9s ease-out 1; }
    @media (prefers-reduced-motion: reduce){
      .jumbotron-header.jumbo-flash{ animation:none; }
      .reveal-banner.is-imminent .reveal-clock{ animation:none; }
    }

    /* The flip. Staggered per column so it ripples across the board rather than
       every cell popping at once. */
    @keyframes cfp-flip-in{
      0%   { transform:rotateX(-90deg); opacity:0; }
      60%  { transform:rotateX(12deg);  opacity:1; }
      100% { transform:rotateX(0);      opacity:1; }
    }
    td.pick-revealing{
      animation:cfp-flip-in .5s cubic-bezier(.2,.75,.3,1) both;
      transform-origin:center top; backface-visibility:hidden;
    }
    @media (prefers-reduced-motion: reduce){
      td.pick-revealing{ animation:none; }
      .reveal-dot{ animation:none; }
    }

  <!-- Instant paint. A classic (non-module) script so it runs the moment the
       parser reaches it - before the module graph, and therefore before the
       Supabase bundle, is fetched. Returning visitors see real standings in the
       first frame instead of a skeleton. Written by saveSnapshot() below. -->
  <script id="instant-paint">
    (function () {
      try {
        var raw = localStorage.getItem('cfb_snapshot_v1');
        if (!raw) return;
        var snap = JSON.parse(raw);
        if (!snap || snap.v !== 2 || !snap.bodyHtml) return;

        var head = document.getElementById('thead-row');
        var body = document.getElementById('tbody');
        var table = document.getElementById('leaderboard-table');
        var skel = document.getElementById('table-loading');

        var st = document.getElementById('status');

        window.__cfbPaintedFromCache = true;
      } catch (e) { /* corrupt or unavailable storage - fall through to normal load */ }
    })();

    // TEAM COLOUR, MADE READABLE ON THIS PANEL - and deliberately living here
    // rather than in utils.js.
    //
    // It was an export there for about ten minutes and that is exactly how long

    //
    // Half the palette is a dark navy, maroon or forest green - Virginia is
    // #232D4B, Penn State #041E42 - and those are invisible on #0a0b0d. So hue
    // and saturation are kept exactly as they are and only lightness is raised,
    // climbing from the colour's OWN lightness in small steps until it clears a
    // contrast bar of 3.2. Starting from a fixed midpoint overshoots and turns
    // Alabama's crimson pink; 3.2 rather than the 4.5 for body copy because
    // these are four bold letters beside the team's own logo, and at 4.5 Auburn
    // comes out sky blue.
    const BOARD_BG = [0x0a, 0x0b, 0x0d];
    const MIN_CONTRAST = 3.2;
    const srgbC = c => { const v = c / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const lumin = ([r, g, b]) => 0.2126 * srgbC(r) + 0.7152 * srgbC(g) + 0.0722 * srgbC(b);
    const contrastOf = (a, b) => {
      const la = lumin(a), lb = lumin(b);
      return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
    };
    function hexToRgb(hex) {
      const raw = String(hex || '').trim().replace(/^#/, '');
      const six = raw.length === 3 ? raw.split('').map(c => c + c).join('') : raw;
      if (!/^[0-9a-f]{6}$/i.test(six)) return null;
      const n = parseInt(six, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    const toHexC = ([r, g, b]) =>
      '#' + [r, g, b].map(v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0')).join('');
    function rgbToHsl([r, g, b]) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
      if (max === min) return [0, 0, l];
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      let h;
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
      else if (max === g) h = ((b - r) / d + 2) / 6;
      else h = ((r - g) / d + 4) / 6;
      return [h, s, l];
    }
    function hslToRgb([h, s, l]) {
      if (s === 0) { const v = l * 255; return [v, v, v]; }
      const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p2 = 2 * l - q;
      const hue = tt => {
        let x = tt; if (x < 0) x += 1; if (x > 1) x -= 1;
        if (x < 1 / 6) return p2 + (q - p2) * 6 * x;
        if (x < 1 / 2) return q;
        if (x < 2 / 3) return p2 + (q - p2) * (2 / 3 - x) * 6;
        return p2;
      };
      return [hue(h + 1 / 3) * 255, hue(h) * 255, hue(h - 1 / 3) * 255];
    }
    function teamColorOnDark(teamName) {
      const rgb = hexToRgb(getTeamColor(teamName));
      if (!rgb) return null;
      if (contrastOf(rgb, BOARD_BG) >= MIN_CONTRAST) return toHexC(rgb);
      const [h, s, l0] = rgbToHsl(rgb);
      for (let l = l0 + 0.02; l <= 0.9; l += 0.02) {
        const lifted = hslToRgb([h, s, l]);
        if (contrastOf(lifted, BOARD_BG) >= MIN_CONTRAST) return toHexC(lifted);
      }
      return toHexC(hslToRgb([h, s, 0.9]));
    }

    // WHAT CHANNEL IS IT ON. Only three of the nineteen networks in this
    // database are too long for a phone column - the rest are already four or
    // five characters. The full name goes out too, and CSS shows whichever one
    // the width can afford.

      'ACC Network': 'ACCN',
      'SEC Network': 'SECN',
      'USA Net': 'USA'
    };
    const shortNetwork = n => NETWORK_SHORT[String(n || '').trim()] || String(n || '').trim();

    // E**N, ON EVERY ESPN CHANNEL.
    //
    // Where the S and the P sit differs per mark, so the band to cut is measured
    // per asset rather than assumed. Their letters touch - none of these files
    // has a single empty column - so the joins were found from the column-by-
    // column ink profile of each one, taking the minima: ESPN's fall at 25.0 /
    // 49.0 / 74.0% of its width, ESPN2's at 19.7 / 38.7 / 58.0 / 79.3, ESPN+'s
    // at 20.3 / 39.3 / 58.7 / 80.0. The pairs below are the join before the S

    const ESPN_REDACT = {
      'ESPN':  [23.5, 74.5],
      'ESPN2': [18.5, 58.5],
      'ESPN+': [19.0, 59.2],
    };

    // ESPNU is deliberately absent, and so is anything else that turns up. Its
    // mark is not a flat wordmark but a shield - white letters knocked out of a
    // solid black badge - so a band cut through it punches a hole in the badge
    // rather than removing letters, and it is nearly opaque end to end, which
    // means the white-silhouette filter flattens it to a slab whether it is cut
    // or not. Channels without a measured band drop the mark and take the
    // asterisks in letters instead, which is correct for any future one too.
    const isEspnFamily = n => /^ESPN/i.test(String(n || '').trim());
    const starEspn = n => String(n || '').replace(/^ESP/i, 'E**');

    const headerStatusEls = new Map();

    // Perf cache
    const STORAGE_KEYS = {
      lastSeason: 'cfb_last_season_v1',
      lastWeek:   'cfb_last_week_v1',
      logos: 'cfb_logos_v1',
      logosTTL: 'cfb_logos_ttl_v1',
      abbrev: 'cfb_abbrev_v1',
      abbrevTTL: 'cfb_abbrev_ttl_v1',
    };
    const LOGOS_TTL_MS = 7 * 24 * 60 * 60 * 1000;

    function getCached(key) {
      const v = localStorage.getItem(key);

    }
    function setCached(key, val) {

    function getCachedMap(key, ttlKey){

      try{

    // ---- Instant paint: last-known standings ----------------------------------

    // Load current user's team

    // Startup

      const navReady    = initNav().catch(e => console.warn('nav init failed:', e));

        isPlayoffView = false;
        weekSelect.value = String(currentWeek);
        setCached(STORAGE_KEYS.lastWeek, currentWeek);
      } else {
        currentWeek = null;
        isPlayoffView = false;

      // Rendering needs the current user's team (row highlight) and the logo map.
      await Promise.all([navReady, userReady, assetsReady]);

        await loadPlayoffWeek();
      } else if (currentWeek != null) {

      } else {
        await loadTeamsOnly();
      }

      seasonSelect.onchange = async () => {
        ++loadSeq;                       // abandon anything already in flight
        currentSeason = Number(seasonSelect.value);
        setCached(STORAGE_KEYS.lastSeason, currentSeason);

        const maxPickedWeek2 = await loadWeeksForSeason(currentSeason);

        if (Number.isFinite(maxPickedWeek2) && maxPickedWeek2 > 15) {
          currentWeek = 'playoff';
          isPlayoffView = true;
          weekSelect.value = 'playoff';
          localStorage.removeItem(STORAGE_KEYS.lastWeek);
        } else if (Number.isFinite(maxPickedWeek2)) {
          currentWeek = maxPickedWeek2;
          isPlayoffView = false;
          weekSelect.value = String(currentWeek);
          setCached(STORAGE_KEYS.lastWeek, currentWeek);
        } else {
          currentWeek = null;
          isPlayoffView = false;
          weekSelect.value = '';
        }

        // ✅ Recompute points
        if (isPlayoffView) {
          await computePlayoffWins();
          await loadPlayoffWeek();
        } else if (Number.isFinite(currentWeek)) {
          await computeSeasonWinsThroughWeek(currentWeek);
          await loadWeek(currentWeek);
        } else {
          await loadTeamsOnly();
        }
      };

      weekSelect.onchange = async ()=> {
        ++loadSeq;                       // abandon anything already in flight
        const val = weekSelect.value;
        if (val === '') return;          // week picker was cleared by a season change
        if (val === 'playoff') {
          currentWeek = 'playoff';
          isPlayoffView = true;
          isTiebreakerView = false;
          localStorage.removeItem(STORAGE_KEYS.lastWeek);
          await computePlayoffWins();
          await loadPlayoffWeek();
        } else if (val === 'tiebreakers' || val === 'playoff-tiebreakers') {
          currentWeek = val;
          isPlayoffView = false;
          isTiebreakerView = true;
          localStorage.removeItem(STORAGE_KEYS.lastWeek);
          await loadTiebreakerWeek(val === 'playoff-tiebreakers' ? 'playoff' : 'regular');
        } else {
          currentWeek = Number(val);
          isPlayoffView = false;
          isTiebreakerView = false;
          setCached(STORAGE_KEYS.lastWeek, currentWeek);
          await computeSeasonWinsThroughWeek(currentWeek);
          await loadWeek(currentWeek);
        }
      };
    }
    startup();

    // Loaders
    // ---- Season data cache --------------------------------------------------
    // Loading the leaderboard used to take five serial round trips: the week
    // list, then the decided games, then their picks, then this week's games,
    // then its picks. Each costs ~130ms of network for ~0.2ms of database work,
    // and every one of them is a slice of the same two sets. So both are fetched
    // once per season and sliced locally: five round trips become two.
    let seasonCache = { season: null, games: null, picks: null, tbGames: null, tbPicks: null };

    async function loadSeasonData(season){
      if (seasonCache.season === season && seasonCache.games) return seasonCache;

      const { data: games, error: gErr } = await supabase
        .from('all_games')
        .select('GameId, Away, Home, AwayPts, HomePts, line, winner, Status, Period, Clock, "Start (CT)", Network, network_logo, picked, week, espn_url, cfb_season, tiebreaker, fpi_margin, line_open, line_live, line_live_at, line_live_kind, possession, is_red_zone')
        .eq('cfb_season', season)
        .eq('picked', true);
      if (gErr){ status('Could not load the season schedule.', true); return null; }

      const ids = (games || []).map(g => g.GameId);
      let picks = [];
      if (ids.length){
        const { data: p, error: pErr } = await supabase
          .from('picks').select('team_id, game_id, pick').in('game_id', ids);
        if (pErr){ status('Could not load picks.', true); return null; }
        picks = p || [];
      }

      // Tiebreaker games are picked=false, so the query above never sees them.
      // They are fetched and cached SEPARATELY and deliberately: dropping them
      // into cache.games would put them in the week picker as ordinary weeks and
      // walk them straight into the season points.
      const { data: tbGames } = await supabase
        .from('all_games')
        .select('GameId, Away, Home, AwayPts, HomePts, line, winner, Status, Period, Clock, "Start (CT)", Network, network_logo, picked, week, espn_url, cfb_season, tiebreaker, line_live, line_live_at, line_live_kind, possession, is_red_zone')
        .eq('cfb_season', season)
        .eq('tiebreaker', true);

      let tbPicks = [];
      const tbIds = (tbGames || []).map(g => g.GameId);
      if (tbIds.length) {
        const { data: tp } = await supabase
          .from('picks').select('team_id, game_id, pick').in('game_id', tbIds);
        tbPicks = tp || [];
      }

      seasonCache = { season, games: games || [], picks, tbGames: tbGames || [], tbPicks };
      return seasonCache;
    }

    // A team belongs on a season's board if it's still playing, OR if it played
    // that season. That way someone sitting out drops off the current
    // leaderboard without vanishing from the years they did play.
    function teamsForSeason(rows){
      const played = new Set((seasonCache.picks || []).map(p => Number(p.team_id)));
      return (rows || []).filter(t => t.active !== false || played.has(Number(t.team_id)));
    }

    // Picks for a given set of games, from the cache.
    function picksForGames(ids){
      const want = new Set(ids.map(Number));
      return (seasonCache.picks || []).filter(p => want.has(Number(p.game_id)));
    }

    async function loadSeasons(){
      if(!paintedFromCache) status('Loading seasons…', false, true);

      let data = await (window.__cfbPreload?.seasons ?? Promise.resolve(null));
      if(!data){
        const res = await supabase
          .from('all_games')
          .select('cfb_season')
          .not('cfb_season', 'is', null);
        if(res.error){ status(res.error.message, true); throw res.error; }
        data = res.data;
      }
      seasons = [...new Set((data||[]).map(r => Number(r.cfb_season)).filter(Number.isFinite))].sort((a,b)=>a-b);
      if(!seasons.length) { status('No seasons found.'); throw new Error('no seasons'); }
      seasonSelect.innerHTML = seasons.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    // UPDATED: returns maxPickedWeek
    async function loadWeeksForSeason(season){
      status(`Loading weeks for ${season}…`);
      const cache = await loadSeasonData(season);
      if (!cache) throw new Error('season load failed');

      const uniqueWeeks = [...new Set(cache.games
        .map(r => Number(r.week)).filter(Number.isFinite))].sort((a,b)=>a-b);

      if (!uniqueWeeks.length){
        weeks = [];
        weekSelect.innerHTML = '';
        hasPlayoffOption = false;
        hasRegTiebreakers = false;
        hasPlayoffTiebreakers = false;
        // An empty dropdown just reads as broken - hide it until there are weeks.
        setWeekPickerVisible(false);
        return null;
      }

      const maxPickedWeek = uniqueWeeks[uniqueWeeks.length - 1];
      hasPlayoffOption = maxPickedWeek > 15;

      const regularWeeks = uniqueWeeks.filter(w => w <= 15);
      weeks = regularWeeks;

      const tbAll = cache.tbGames || [];
      hasRegTiebreakers     = tbAll.some(g => g.week == null || Number(g.week) < 16);
      hasPlayoffTiebreakers = tbAll.some(g => g.week != null && Number(g.week) >= 16);

      let html = '';
      if (regularWeeks.length){
        html += regularWeeks.map(w=>`<option value="${w}">Week ${w}</option>`).join('');
      }
      if (hasRegTiebreakers){
        html += `<option value="tiebreakers">Tiebreakers</option>`;
      }
      if (hasPlayoffOption){
        html += `<option value="playoff">Playoff</option>`;
      }
      if (hasPlayoffTiebreakers){
        html += `<option value="playoff-tiebreakers">Playoff Tiebreakers</option>`;
      }

      weekSelect.innerHTML = html;
      setWeekPickerVisible(true);
      return maxPickedWeek;
    }

    async function init(){
      if(!paintedFromCache) status('Loading assets…');

      const logoCached = getCachedMap(STORAGE_KEYS.logos, STORAGE_KEYS.logosTTL);

    // -------- Points (EXCLUDING tiebreakers) --------
    // ✅ Regular season wins THROUGH selected week (1..15, or 0..15 if you have week 0)
    async function computeSeasonWinsThroughWeek(throughWeek){
      if (!Number.isFinite(throughWeek)) {
        winsByTeamRegular = Object.create(null);
        return;
      }

      const cache = await loadSeasonData(currentSeason);
      if (!cache) return;

      const decidedGames = cache.games.filter(g =>
        Number(g.week) <= throughWeek && Number(g.week) <= 15 &&
        g.winner != null && g.tiebreaker !== true);

      const gameIdsSeason = decidedGames.map(g => g.GameId);
      const winnerByGame = Object.create(null);
      (decidedGames||[]).forEach(g=>{ winnerByGame[g.GameId] = g.winner; });

      if (!gameIdsSeason.length){
        winsByTeamRegular = Object.create(null);
        return;
      }

      const allPicks = picksForGames(gameIdsSeason);

      const map = Object.create(null);
      (allPicks||[]).forEach(p=>{
        const winner = winnerByGame[p.game_id];
        if(!winner) return;
        if(sameTeam(p.pick, winner)){
          map[p.team_id] = (map[p.team_id] || 0) + 1;
        }
      });

      winsByTeamRegular = map;
    }

    async function computePlayoffWins(){
      const { data: decidedGames, error: dgErr } = await supabase
        .from('all_games')
        .select('GameId, winner, week')
        .eq('cfb_season', currentSeason)
        .gt('week', 15)
        .not('winner', 'is', null)
        .or('tiebreaker.is.null,tiebreaker.eq.false');

      if(dgErr){ status(dgErr.message, true); return; }

      const gameIdsPo = (decidedGames || []).map(g => g.GameId);
      const winnerByGame = Object.create(null);
      (decidedGames||[]).forEach(g=>{ winnerByGame[g.GameId] = g.winner; });

      if (!gameIdsPo.length){
        winsByTeamPlayoff = Object.create(null);
        return;
      }

      const { data: allPicks, error: pErr } = await supabase
        .from('picks')
        .select('team_id, game_id, pick')
        .in('game_id', gameIdsPo);
      if(pErr){ status(pErr.message, true); return; }

      const map = Object.create(null);
      (allPicks||[]).forEach(p=>{
        const winner = winnerByGame[p.game_id];
        if(!winner) return;
        if(sameTeam(p.pick, winner)){
          map[p.team_id] = (map[p.team_id] || 0) + 1;
        }
      });
      winsByTeamPlayoff = map;
    }

    // Week loaders
    // No games have been picked for this season yet — pre-season, or the
    // commissioner hasn't selected games. Show the full roster with a zeroed
    // scoreboard rather than leaving the loading skeleton up forever.
    async function loadTeamsOnly(){
      status(`Loading Season ${currentSeason}…`, false, true);
      isPlayoffView = false;
      stopLiveTicker();
      headerStatusEls.clear();

      lastGames   = [];
      gameIds     = [];
      winnerMap   = {};
      lineMap     = {};
      weekStartTs = null;

    async function loadWeek(week){
      // Number(null) is 0, which is finite - so this has to test for null first.
      if (week == null || !Number.isFinite(Number(week))) return;
      const mySeq = loadSeq;
      status(`Loading S${currentSeason} • Week ${week}…`);
      isPlayoffView = false;
      stopLiveTicker();
      headerStatusEls.clear();

      const cache = await loadSeasonData(currentSeason);
      if(!cache) return;
      if(mySeq !== loadSeq) return;   // a newer selection won
      const gamesRaw = cache.games.filter(g => Number(g.week) === Number(week));

      const games = (gamesRaw || []).slice().sort((a, b) => {
        const ta = kickoffMs(a) ?? Infinity;
        const tb = kickoffMs(b) ?? Infinity;
        return ta - tb;
      });
      lastGames = games;
      updateSeasonalTheme(currentSeason, games);

      weekStartTs = null;
      gameStartTs = {};
      for (const g of games) {
        const ts = kickoffMs(g);
        if (Number.isFinite(ts)) {
          gameStartTs[g.GameId] = ts;
          weekStartTs = (weekStartTs==null) ? ts : Math.min(weekStartTs, ts);
        }
      }
      // Reveal uses the exact predicate picks.html locks on, so the board can
      // never show a pick that is still editable. Unknown kickoff -> stay hidden.
      showPicks = isWeekLocked(games);

      winnerMap = {}; lineMap = {};
      gameIds = games.map(g=>g.GameId);
      games.forEach(g=>{
        winnerMap[g.GameId] = g.winner ?? null;
        lineMap[g.GameId]   = (typeof g.line === 'number') ? g.line : (g.line!=null? Number(g.line): null);
      });

      let teamRows = await (window.__cfbPreload?.teams ?? Promise.resolve(null));
      if(!teamRows){
        const res = await supabase
          .from('teams')
          .select('team_id, team_name, active')
          .order('team_name', { ascending: true });
        if(res.error) return status(res.error.message, true);
        teamRows = res.data;
      }

      const pickRows = picksForGames(gameIds);

      const pickMap = buildPickMap(pickRows);

      // ✅ Points for non-playoff view already computed through currentWeek
      const pointsMap = winsByTeamRegular;
      const teamsSorted = [...teamsForSeason(teamRows)].sort((a,b)=>{
        const pa = getPoints(pointsMap, a.team_id);
        const pb = getPoints(pointsMap, b.team_id);
        if(pb !== pa) return pb - pa;
        return a.team_name.localeCompare(b.team_name);
      });

      lastTeams = teamsSorted;
      lastPickMap = pickMap;

      const gameNameMap = buildGameNameMap(games);
      renderHeader(gameNameMap, games);
      renderTable(teamsSorted, pickMap, winnerMap, showPicks, pointsMap, false);
      await renderWeeklySubmissions(teamsSorted, pickMap);
      showTable();

      // Only meaningful once the week is over; the recap hides itself otherwise.
      renderWeekRecap(document.getElementById('week-recap'),
        { season: currentSeason, week, games, teams: teamsSorted })
        .catch(e => console.warn('week recap unavailable:', e));

      saveSnapshot();
      startLiveTicker();
      startRevealCountdown();
      if (!showPicks && weekStartTs) {
        status(`Picks hidden until kickoff at ${formatTimeCentral(weekStartTs)} CT • Season ${currentSeason} • Week ${week}`);
      } else {
        status(`Season ${currentSeason} • Week ${week}`);
      }
    }

    async function loadPlayoffWeek(){
      { const el = document.getElementById('week-recap'); if (el) { el.hidden = true; el.innerHTML = ''; } }
      const mySeq = loadSeq;
      status(`Loading S${currentSeason} • Playoff…`);
      isPlayoffView = true;
      stopLiveTicker();
      headerStatusEls.clear();

      const cache = await loadSeasonData(currentSeason);
      if(!cache) return;
      if(mySeq !== loadSeq) return;
      const gamesRaw = cache.games.filter(g => Number(g.week) > 15);

      const games = (gamesRaw || []).slice().sort((a, b) => {
        const ta = kickoffMs(a) ?? Infinity;
        const tb = kickoffMs(b) ?? Infinity;

      });
      lastGames = games;
      updateSeasonalTheme(currentSeason, games);

      weekStartTs = null;
      gameStartTs = {};
      for (const g of games) {
        const ts = kickoffMs(g);
        if (Number.isFinite(ts)) {

      const { data: playoffRows, error: poErr } = await supabase

    // Tiebreakers ride the same board but are scored on their own. A tiebreaker
    // is only ever consulted when two players finish level, so counting one
    // toward the season would defeat the point of having them. Everything here
    // reads from seasonCache.tbGames / tbPicks, which no other view touches.
    async function loadTiebreakerWeek(kind){
      { const el = document.getElementById('week-recap'); if (el) { el.hidden = true; el.innerHTML = ''; } }
      const isPlayoffTb = kind === 'playoff';
      const label = isPlayoffTb ? 'Playoff Tiebreakers' : 'Tiebreakers';
      const mySeq = loadSeq;
      status(`Loading S${currentSeason} \u2022 ${label}\u2026`);
      isPlayoffView = false;
      isTiebreakerView = true;
      stopLiveTicker();
      headerStatusEls.clear();

      const cache = await loadSeasonData(currentSeason);
      if(!cache) return;
      if(mySeq !== loadSeq) return;

      // week >= 16 is the playoff tiebreaker set; anything earlier (or with no
      // week at all) belongs to the regular season. The two are scored apart,
      // so a player's playoff tiebreaks never help their regular-season tally.
      const games = (cache.tbGames || [])
        .filter(g => isPlayoffTb
          ? (g.week != null && Number(g.week) >= 16)
          : (g.week == null || Number(g.week) < 16))
        .slice()
        .sort((a, b) => {
          const ta = kickoffMs(a) ?? Infinity;
          const tb = kickoffMs(b) ?? Infinity;
          return ta - tb;
        });
      lastGames = games;

      weekStartTs = null;
      gameStartTs = {};
      for (const g of games) {
        const ts = kickoffMs(g);
        if (Number.isFinite(ts)) {
          gameStartTs[g.GameId] = ts;
          weekStartTs = (weekStartTs==null) ? ts : Math.min(weekStartTs, ts);
        }
      }
      // Per-game reveal, as the playoff board does: a tiebreaker can be days
      // away from its neighbours, so one shared lock would hide finished ones.
      showPicks = true;

      winnerMap = {}; lineMap = {};
      gameIds = games.map(g=>g.GameId);
      games.forEach(g=>{
        winnerMap[g.GameId] = g.winner ?? null;
        lineMap[g.GameId]   = (typeof g.line === 'number') ? g.line : (g.line!=null? Number(g.line): null);
      });

      let teamRows = await (window.__cfbPreload?.teams ?? Promise.resolve(null));
      if(!teamRows){
        const res = await supabase
          .from('teams')
          .select('team_id, team_name, active')
          .order('team_name', { ascending: true });
        if(res.error) return status(res.error.message, true);
        teamRows = res.data;
      }
      if(mySeq !== loadSeq) return;

      const want = new Set(gameIds.map(Number));
      const pickRows = (cache.tbPicks || []).filter(p => want.has(Number(p.game_id)));
      const pickMap = buildPickMap(pickRows);

      // Tiebreaker points: correct tiebreaker calls, and nothing else. Kept in a
      // local so it can never be mistaken for winsByTeamRegular.
      const tbPoints = Object.create(null);
      for (const p of pickRows){
        const w = winnerMap[p.game_id];
        if (w == null) continue;
        if (sameTeam(p.pick, w)) tbPoints[p.team_id] = (tbPoints[p.team_id] || 0) + 1;
      }

      const teamsSorted = [...teamsForSeason(teamRows)].sort((a,b)=>{
        const pa = getPoints(tbPoints, a.team_id);
        const pb = getPoints(tbPoints, b.team_id);
        if(pb !== pa) return pb - pa;
        return a.team_name.localeCompare(b.team_name);
      });

      lastTeams = teamsSorted;
      lastPickMap = pickMap;

      const gameNameMap = buildGameNameMap(games);
      renderHeader(gameNameMap, games);
      renderTable(teamsSorted, pickMap, winnerMap, true, tbPoints, true);
      showTable();

      startLiveTicker();
      const decided = games.filter(g => g.winner != null).length;
      status(`Season ${currentSeason} \u2022 ${label} \u2014 ${decided} of ${games.length} settled. These do not count toward season points.`);
    }

    function getLogoForPickExact(pick){
      if(!pick) return null;
      return logoByTeam[pick] || null;
    }

    // IS THIS GAME BEING PLAYED RIGHT NOW?
    //
    // Everything live on this page hangs off this one question, so it is asked
    // in one place. The column is written by a Supabase edge function that is
    // deployed rather than versioned in this repo, and ESPN's own feed offers
    // two spellings for the same state - `state: "in"` and
    // `name: "STATUS_IN_PROGRESS"`. This page has always read 'in_progress' and
    // a season of live scores says that is right, but the score-feed fix in
    // 0c0b9ba hedged across both, so somebody was not certain. Accepting either
    // costs nothing and removes the one failure that would take the whole live
    // board down silently.
    //
    // The period fallback is last and deliberately narrow: a game that is not
    // final, not still scheduled, and has a quarter on it is being played,
    // whatever the feed decided to call it.
    const LIVE_WORDS = new Set(['in_progress', 'in progress', 'inprogress', 'in', 'live']);
    const DEAD_WORDS = new Set(['final', 'scheduled', 'pre', 'postponed', 'canceled', 'cancelled', '']);

    const isLiveStatus = st => LIVE_WORDS.has(String(st ?? '').trim().toLowerCase());

    function isLive(row){
      if (!row) return false;
      const st = String(row.Status ?? '').trim().toLowerCase();
      if (isLiveStatus(st)) return true;
      if (DEAD_WORDS.has(st)) return false;
      return Number(row.Period) >= 1;
    }

    // THE LIVE LINE, and what makes it safe to show next to the scored one.
    //
    // all_games.line is frozen at Tuesday 11:00 and is the only number anything
    // is graded against. all_games.line_live is a separate column carrying the
    // in-game price off ESPN's live-odds provider, refreshed every minute by
    // sync_live_lines(). It is shown only while a game is actually running, and
    // only while the feed is demonstrably alive: line_live_at is re-stamped on
    // every successful read, so a clock that has stopped means the feed died,
    // not that the market went quiet. A frozen number wearing a LIVE label is
    // worse than no number at all, so past that age it simply disappears.
    const LIVE_LINE_MAX_AGE_MS = 15 * 60 * 1000;

    // Any game that has not finished, not only one being played. Lines move all
    // week and ours freezes on the Tuesday, so the gap between what a week was
    // picked at and where the market stands is worth showing from the moment it
    // opens - not just for three hours on a Saturday.
    function liveLineOf(row){
      if (!row) return null;
      if (String(row.Status ?? '').trim().toLowerCase() === 'final') return null;
      const v = row.line_live == null ? null : Number(row.line_live);
      if (v == null || Number.isNaN(v)) return null;
      const t = row.line_live_at ? Date.parse(row.line_live_at) : NaN;
      if (!Number.isFinite(t) || Date.now() - t > LIVE_LINE_MAX_AGE_MS) return null;
      return v;
    }

    // Same sign convention as the scored line: the stored number is the home
    // team's, so the away side is its negation.
    // One banner across the foot of the cell, naming the side laying the points.
    //
    // Not a number under each team, mirrored. Measured in the running app, a
    // phone column leaves 38.3px between the scores and "TCU -6.5" needs 40. The
    // banner is the only element spanning the whole 51px cell, which is what
    // makes it fit at all - and naming the team is what lets one number do the
    // work of two.
    //
    // The stored number is the home team's, so a negative one means the home side
    // is laying the points. Whoever is laying them is quoted negative.
    // The banner keeps its space whether or not it has a number in it. Hiding it
    // outright made the live column shorter than its neighbours by the height of
    // the strip, and since the header cells are vertically centred that pushed
    // every row in that column out of line with the same row beside it - the
    // scores sat 13px apart across a single week.
    // The label is only true while at least one game has a number under it.
    function refreshLiveTag(){
      if (!liveTagEl) return;
      let any = false;
      headerStatusEls.forEach(e => {
        if (e.bannerEl && !e.bannerEl.classList.contains('is-empty')) any = true;
      });
      liveTagEl.hidden = !any;
    }

    // A SCORE GOING UP SHOULD LOOK LIKE SOMETHING.
    //
    // The number used to swap silently, which on a board you are watching for
    // three hours is the one moment worth noticing and the one it did nothing
    // for. Now the digits punch out and the points that were just scored rise
    // off them and fade - so a touchdown reads as a touchdown from across the
    // room, and you can tell a 7 from a 3 without doing the arithmetic.
    //
    // Only ever on the way up, and only for a game being played: a correction, a
    // reload or a change of week must not set fireworks off. The first paint
    // records the score without animating for exactly that reason.
    const SCORE_DELTA_MS = 1300;

    function setScore(el, teamEl, value, live){
      if (!el) return;
      const text = (value !== '' && value != null) ? String(value) : '\u2013';
      const prev = el.dataset.score;
      if (el.textContent !== text) el.textContent = text;
      if (prev === undefined || prev === text) { el.dataset.score = text; return; }
      el.dataset.score = text;

      const before = Number(prev), after = Number(text);
      if (!live || !Number.isFinite(before) || !Number.isFinite(after) || after <= before) return;

      el.classList.remove('is-scored');
      void el.offsetWidth;              // restart it if two scores land close together
      el.classList.add('is-scored');
      setTimeout(() => el.classList.remove('is-scored'), 900);

      if (!teamEl) return;
      const d = document.createElement('span');
      d.className = 'score-delta';
      d.textContent = '+' + (after - before);
      teamEl.appendChild(d);
      setTimeout(() => d.remove(), SCORE_DELTA_MS + 120);
    }

    // Who has the ball. A dot rather than a word, and positioned absolutely, so
    // it costs none of the 38px a phone column has between the two scores.
    // ONE DOT, THREE THINGS. The same mark in the same place beside the score
    // carries every per-side fact this board has, and which fact it is comes
    // from its colour:
    //
    //   white  this side has the ball
    //   red    ...and they are inside the twenty
    //   green  the game is over and this side covered
    //
    // Doing it with one element rather than three is what keeps it legible in a
    // cell this size, and it means the states can never contradict each other -
    // a game cannot be live and final at once, so the dot cannot be two colours.
    function paintDots(entry, row){
      if (!entry) return;
      const live = isLive(row);
      const covered = live ? null : coveringSide(entry, row);
      const side = live ? String(row?.possession ?? '') : (covered || '');
      const red = live && row?.is_red_zone === true;
      const set = (el, on, team) => {
        if (!el) return;
        el.hidden = !on;
        el.classList.toggle('is-redzone', on && red);
        el.classList.toggle('is-covered', on && !live);
        if (on) el.title = !live ? team + ' covered'
                         : red  ? team + ' in the red zone'
                                : team + ' has the ball';
      };
      set(entry.awayPossEl, side === 'away', entry.awayAbbr);
      set(entry.homePossEl, side === 'home', entry.homeAbbr);
    }

    // THE CHANNEL, AS ITS MARK WHERE THERE IS ONE.
    //
    // ESPN publishes a logo for its own family and a handful of partners and
    // nothing at all for FOX, NBC or CBSSN - across one full Saturday slate six
    // of nine broadcasters had one. So this is not a swap, it is a preference:
    // the mark when it exists, the wordmark otherwise, and the wordmark is what
    // stands until an image has demonstrably decoded.
    //
    // The marks arrive flat and in brand colour, which does not survive this
    // background - ACC Network's is navy and the CW's is solid black, both
    // invisible on it, and ESPN's is the red this board uses for a lost pick.
    // brightness(0) invert(1) in the stylesheet reduces every one of them to a
    // white silhouette at the same weight as the wordmark beside it, which is
    // both legible on black and consistent across a row where some columns show
    // a mark and some show letters.
    function paintNetwork(entry, row){
      if (!entry || !entry.netEl) return;
      const name = String(row?.Network ?? '').trim();
      const src  = String(row?.network_logo ?? '').trim();

      const short = name ? shortNetwork(name) : '';
      const family = isEspnFamily(name);

      entry.netEl.classList.toggle('is-empty', !name);
      // The tooltip keeps the channel's real name - somebody looking for what to
      // put the television on should not have to decode the joke.
      entry.netEl.title = name ? 'On ' + name : '';
      // A non-breaking space rather than nothing, so a week where only some
      // games carry a network still lines up column to column.
      entry.netFullEl.textContent  = name ? (family ? starEspn(name) : name) : '\u00a0';
      entry.netShortEl.textContent = short ? (family ? starEspn(short) : short) : '\u00a0';

      // HOW BIG THE WORDMARK CAN BE, which is a different answer per network.
      //
      // A phone column gives the strip 38px, and the marks fill all 38 of them -
      // that is what made FOX at 7.4px look like a caption next to a logo. The
      // fix is to set the letters near the height of a mark, but the size that
      // does that for FOX does not fit CBSSN, and neither fits PEACOCK.
      //
      // So the size is chosen per column from the length of the name, which the
      // stylesheet cannot see. Every bucket was measured against the 38px: FOX
      // at 12px is 19.7 wide, ESPN at 11px is 22, CBSSN at 10px is 29.3, and
      // PEACOCK - the longest name in the database, and the only one of nineteen
      // that needs the bottom rung - is 35 at 8.5px. Short names come out
      // biggest, which is also what the marks do.
      entry.netEl.dataset.fit = short.length <= 3 ? 'wide'
                              : short.length === 4 ? 'mid'
                              : short.length === 5 ? 'narrow'
                              : 'tight';

      const want = /^https:\/\//i.test(src) ? src : '';
      if (!want) {
        entry.netLogoEl.hidden = true;
        entry.netLogoEl.removeAttribute('src');
        entry.netEl.classList.remove('has-logo');
        return;
      }
      // The band this mark's S and P occupy, if it is one we have measured. The
      // same two numbers drive the cut and the box the asterisks are centred in,
      // so the two can never drift apart.
      const band = family ? ESPN_REDACT[name] : null;
      entry.netEl.classList.toggle('is-espn', !!band);
      if (band) {
        entry.netEl.style.setProperty('--redact-a', band[0] + '%');
        entry.netEl.style.setProperty('--redact-b', band[1] + '%');
      } else {
        entry.netEl.style.removeProperty('--redact-a');
        entry.netEl.style.removeProperty('--redact-b');
      }

      // An ESPN channel we have no band for shows no mark at all - the letters
      // carry the asterisks instead. Handled here rather than by hiding the
      // image, so nothing is ever fetched that will not be drawn.
      if (family && !band) {
        entry.netLogoEl.hidden = true;
        entry.netLogoEl.removeAttribute('src');
        entry.netEl.classList.remove('has-logo');
        return;
      }

      entry.netLogoEl.alt = name;
      if (entry.netLogoEl.getAttribute('src') !== want) {
        // Back to the wordmark until the new one loads, never through a gap.
        entry.netLogoEl.hidden = true;
        entry.netEl.classList.remove('has-logo');
        entry.netLogoEl.setAttribute('src', want);
      }
    }

    function paintLive(entry, row){
      if (!entry || !entry.bannerEl) return;
      const v = liveLineOf(row);
      if (v == null) {
        entry.bannerEl.classList.add('is-empty');
        entry.bannerEl.textContent = '\u00a0';
        return;
      }
      const team = v < 0 ? entry.homeAbbr : entry.awayAbbr;
      entry.bannerEl.textContent = team + ' −' + Math.abs(v);
      entry.bannerEl.classList.remove('is-empty');
    }

    // The centre of the cell, in one place instead of two. It was built inline in
    // renderHeader and rebuilt again in the ticker, which is how the two drifted.
    function paintCenter(centerEl, row){
      if (!centerEl) return;
      centerEl.innerHTML = '';
      const add = (cls, txt) => {
        const d = document.createElement('div');
        d.className = cls; d.textContent = txt; centerEl.appendChild(d);
      };
      if (String((row && row.Status) || '').trim().toLowerCase() === 'final') {
        add('game-hdr-final', 'FINAL');
        return;
      }
      if (isLive(row)) {
        const clk = String((row && row.Clock) || '').trim();
        const p = Number(row && row.Period) || 1;
        // A quarter that has run out says so. "2ND 0:00" is what the clock
        // reads, but nobody calls it that - and "4TH 0:00" sitting there looks
        // like the feed has jammed when it is really ESPN holding the game open
        // between the clock hitting zero and the result going official, which
        // can be several minutes. FINAL still only ever comes from ESPN saying
        // so; this is only about naming the gap honestly.
        //
        // Derived from the period and the clock rather than from a status of its
        // own: no new field, no extra parsing, and it cannot break separately
        // from the score it arrives with.
        if (clk === '0:00') {
          add('game-hdr-state', p === 2 ? 'HALF' : 'END ' + periodLabel(p));
          return;
        }
        // One row, and no separator between them. Measured in the running app:
        // "1ST . 4:00" comes to 38.8px against 38.3px of usable width in a phone
        // column, and the dot is exactly what pushes it over. "1ST 4:00" is 33.8.
        const per = periodLabel(p);
        add('game-hdr-state', clk ? per + ' ' + clk : per);
        return;
      }
      add('game-hdr-time', formatTimeCentral(row && row['Start (CT)']) || 'TBD');
    }

    // LIVE COVER, and why it is the same sum the database does.
    //
    // set_winner_on_final() settles a finished game with `(HomePts + line) >
    // AwayPts`. Evaluate that same expression while the game is still being
    // played and what comes out is the cover margin: how many points the home
    // side is covering by right now, negative if it is the away side. So the
    // shading on the board mid-game is not an approximation of the rule that
    // will decide it - it is that rule, run early.
    //
    // It can never land on zero. Every line in the table ends in .5 by trigger,
    // and an integer score plus .5 is never an integer, so there is no level
    // state to colour - which is the same reason this league needs no push rule.
    function coverMargin(row){
      if (!isLive(row)) return null;
      const ln = row.line    == null ? NaN : Number(row.line);
      const a  = row.AwayPts == null ? NaN : Number(row.AwayPts);
      const h  = row.HomePts == null ? NaN : Number(row.HomePts);
      if (!Number.isFinite(ln) || !Number.isFinite(a) || !Number.isFinite(h)) return null;
      return (h + ln) - a;
    }

    // The same margin from one pick's side of it: positive means this pick is
    // covering by that many points.
    function coverForPick(row, pick){
      const m = coverMargin(row);
      if (m == null || !pick) return null;
      if (sameTeam(pick, row.Home)) return m;
      if (sameTeam(pick, row.Away)) return -m;
      return null;   // a pick that matches neither side of the game it is on
    }

    // HOW SETTLED IS IT? The margin above says who is covering; on its own it is
    // a bad thing to colour a board with, because at 0-0 it equals the line. Kick
    // off and every cell would take a side instantly, having learned nothing -
    // it would just be restating the spread, which is already printed above it.
    //
    // What the shading should track is the expected FINAL margin, and how much
    // game is left to change it:
    //
    //   expected final margin  =  margin now  -  line x (share of game left)
    //
    // because over a whole game the favourite is expected to win by exactly the
    // line, so what is still to come is the line scaled by the time still to
    // play. At kickoff that comes out at 0 - a coin flip, no colour - and it
    // earns colour only as the game says something the spread did not.
    //
    // The spread is 15.2 points wide, one standard deviation, measured over the
    // 756 completed FBS games of 2025: residual (HomePts + line) - AwayPts had a
    // mean of +1.14, so the market is near enough unbiased, and a stdev of 15.2.
    // Uncertainty shrinks with the root of the time left, so a 3-point cushion
    // is nearly nothing in the first quarter and nearly everything with a minute
    // to go.
    const SIGMA_FULL   = 15.2;   // points, 1 s.d. of final margin around the line
    const SIGMA_FLOOR  = 0.8;    // keeps the last tick of the clock from dividing by zero
    const OT_FRACTION  = 0.05;   // overtime: barely any clock, still plenty of swing
    const REG_MINUTES  = 60;

    function fractionRemaining(row){
      const per = Number(row.Period);
      if (!Number.isFinite(per) || per < 1) return 1;
      if (per >= 5) return OT_FRACTION;
      const m = String(row.Clock || '').trim().match(/^(\d+):(\d{2})$/);
      // No clock on the row yet - treat it as mid-quarter rather than guessing
      // in either direction.
      const mins = m ? Number(m[1]) + Number(m[2]) / 60 : 7.5;
      const left = (4 - per) * 15 + Math.min(15, Math.max(0, mins));
      return Math.min(1, Math.max(0, left / REG_MINUTES));
    }

    // Normal CDF, Abramowitz & Stegun 26.2.17. Max error 7.5e-8, which is many
    // orders of magnitude finer than a colour ramp can show.
    function normalCdf(z){
      const t = 1 / (1 + 0.2316419 * Math.abs(z));
      const d = 0.3989422804014327 * Math.exp(-z * z / 2);
      const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
                t * (-1.821255978 + t * 1.330274429))));
      return z >= 0 ? 1 - p : p;
    }

    // WHERE THE EXPECTED FINAL MARGIN COMES FROM.
    //
    // First choice is the market. An in-play spread is a full-game number - it
    // already contains the score, the clock, who has the ball and every injury
    // the room knows about - so the gap between our frozen line and the live one
    // IS the expected final cover margin, with no modelling on our side:
    //
    //     expected final  =  line  -  line_live
    //
    // Verified on the tail of real games, where the live number converges on the
    // result: Ohio State at Michigan closed live at 18.5 against a final margin
    // of 18, Grambling at Ohio State at -69.5 against -70, Texas Tech at West
    // Virginia at 46.5 against 49.
    //
    // Held to a much tighter freshness bar than the number the header displays.
    // A stale live line is worse than none: the clock keeps running, so sigma
    // keeps shrinking, and the shading would get more confident about a quote
    // that stopped tracking the game. Past this it falls back to the clock.
    const MARKET_MAX_AGE_MS = 4 * 60 * 1000;

    function marketExpectation(row, sign){
      // Only an in-play quote. A pregame book stops moving once the game starts,
      // so reading its closing number as "where this will finish" would call a
      // blowout an even game - and it is exactly what gets stored whenever ESPN
      // drops its in-play provider mid-game, which it does.
      if (row.line_live_kind !== 'inplay') return null;
      const ln = Number(row.line);
      const lv = row.line_live == null ? NaN : Number(row.line_live);
      if (!Number.isFinite(ln) || !Number.isFinite(lv)) return null;
      const at = row.line_live_at ? Date.parse(row.line_live_at) : NaN;
      if (!Number.isFinite(at) || Date.now() - at > MARKET_MAX_AGE_MS) return null;
      return sign * (ln - lv);
    }

    // Fallback, and the only path the postseason has: ESPN publishes no live
    // provider for neutral-site bowl and playoff games. Over a whole game the
    // favourite is expected to win by exactly the line, so what is still to come
    // is the line scaled by the share of the game left to play.
    function clockExpectation(row, sign, m, f){
      const ln = Number(row.line);
      if (!Number.isFinite(ln)) return null;
      return m - (sign * ln) * f;
    }

    // For one pick: where it stands now, and how likely that is to hold.
    function coverOdds(row, pick){
      const m = coverForPick(row, pick);
      if (m == null) return null;
      const f = fractionRemaining(row);
      const sign = sameTeam(pick, row.Home) ? 1 : -1;

      let expected = marketExpectation(row, sign);
      let source = 'live line';
      if (expected == null) {
        expected = clockExpectation(row, sign, m, f);
        source = 'clock';
      }
      if (expected == null) return null;

      // However good the central estimate, the spread of outcomes around it
      // still narrows with the clock rather than with the source.
      const sigma = Math.max(SIGMA_FLOOR, SIGMA_FULL * Math.sqrt(f));
      return { margin: m, p: normalCdf(expected / sigma), source };
    }

    // Colour strength from that probability, and the dead zone is deliberately
    // wide. Anything between 30% and 70% is a game still being played, and
    // shading it says the board knows something it does not. Colour has to mean
    // "this is going one way", so nothing shows until a pick is at least 20
    // points clear of a coin flip, and full strength waits until it is all but
    // settled. Between those it ramps, so a game that is drifting one way looks
    // like it is drifting rather than snapping.
    //
    //     p      50    60    70    75    80    85    90    95
    //     colour  -     -     -    .20   .40   .60   .80   1.00
    //
    // The backdoor alarm is unaffected and this is what makes the two work
    // together: a one-score endgame is a coin flip, so it carries no colour at
    // all and the amber rule has the cell to itself.
    const COVER_DEAD_ZONE = 0.40;   // p within .30-.70 -> no colour
    const COVER_FULL      = 0.90;   // p beyond .05/.95 -> full strength
    function coverIntensity(p){
      const c = Math.abs(2 * p - 1);
      return Math.min(1, Math.max(0, (c - COVER_DEAD_ZONE) / (COVER_FULL - COVER_DEAD_ZONE)));
    }

    // A field goal flips the cover, late enough that there may not be another
    // drive. In a spread pool that is the moment worth shouting about, and it is
    // routinely nothing at all on the scoreboard - a three-score game can sit on
    // a knife edge here.
    const BACKDOOR_PTS = 3.5;
    function isBackdoor(row, margin){
      if (margin == null) return false;
      if (Math.abs(margin) > BACKDOOR_PTS) return false;
      return Number(row.Period) >= 4;
    }

    function paintCovers(){
      if (!coverCells.size) return;
      const byId = new Map();
      for (const g of (lastGames || [])) byId.set(String(g.GameId), g);

      coverCells.forEach(cell => {
        const { td, img, pick, gameId } = cell;
        td.classList.remove('pick-cover', 'pick-nocover', 'pick-backdoor');
        td.style.removeProperty('--cover-i');

        const row = byId.get(String(gameId));
        const odds = row ? coverOdds(row, pick) : null;
        if (!odds) {
          // Back to whatever renderTable decided: settled cells keep their
          // win/loss shading, everything else goes back to waiting.
          if (!td.classList.contains('pick-win') && !td.classList.contains('pick-loss')) {
            td.classList.add('pick-empty');
          }
          td.removeAttribute('title');
          if (img) img.title = pick;
          return;
        }

        const { margin, p, source } = odds;
        const intensity = coverIntensity(p);
        // Never 0% or 100%: the model is a normal curve, not a referee, and a
        // game with a minute left has still been lost from further out.
        const pct = Math.min(99, Math.max(1, Math.round(p * 100)));

        // Below the dead zone there is nothing worth saying in colour, so the
        // cell stays as it was and only the tooltip carries the detail.
        if (intensity > 0) {
          // pick-empty is renderTable's "nothing has happened here yet", and its
          // grey text would drag down a cell that has no logo to shade.
          td.classList.remove('pick-empty');
          td.classList.add(margin > 0 ? 'pick-cover' : 'pick-nocover');
          td.style.setProperty('--cover-i', intensity.toFixed(3));
        }
        if (isBackdoor(row, margin)) td.classList.add('pick-backdoor');

        const words = `${pick} ${margin > 0 ? 'covering' : 'not covering'} by ` +
                      `${Math.abs(margin)} — ${pct}% to cover from here · ${source}`;
        td.title = words;
        if (img) img.title = words;
      });
    }

    // LONELY PICK. Once a week is revealed, a side exactly one person took is the
    // most interesting cell on the board: the only pick that can move somebody
    // past the entire league at once, or drop them behind it.
    //
    // Counted over the teams actually on screen, so it means "alone in this
    // league" rather than "alone in whatever rows came back". And it needs a
    // crowd to be alone against - in a four-handed week a 3-1 split is a stand,
    // in a two-handed one everybody is lonely and the outline means nothing.
    const LONELY_MIN_FIELD = 4;
    function lonelyPicks(teams, pickMap, ids){
      const lonely = new Set();
      (ids || []).forEach(id => {
        const holders = new Map();
        (teams || []).forEach(t => {
          const p = pickMap?.[t.team_id]?.[id];
          if (!p || String(p).trim() === '') return;
          const key = String(p).trim().toLowerCase();
          if (!holders.has(key)) holders.set(key, []);
          holders.get(key).push(t.team_id);
        });
        let field = 0;
        holders.forEach(v => { field += v.length; });
        if (field < LONELY_MIN_FIELD) return;
        holders.forEach(v => { if (v.length === 1) lonely.add(`${v[0]}:${id}`); });
      });
      return lonely;
    }

    // Quarters, spelled the way a scoreboard spells them. The old p + 'TH' was
    // right three times out of four and put "1TH" on the board for the first
    // quarter of the season opener.
    const QUARTER = ['1ST', '2ND', '3RD', '4TH'];
    const periodLabel = p => (Number(p) >= 5 ? 'OT' : (QUARTER[Number(p) - 1] || '1ST'));

    // The score is a fact, not a verdict. It used to glow green for the winner,
    // amber for whoever was ahead and go dim for the other side - three more
    // colours in a column that already had the team colours, the line, the live
    // line, the quarter and the clock. Who is winning is on the scoreboard
    // already, in the numbers; who is COVERING, which is the only thing this
    // league scores, is in the cells underneath.
    const scoreClasses = () => 'game-hdr-score';

    // ON A FINAL, THE SIDE THAT COVERED GOES GOLD.
    //
    // The side that COVERED, not the side that won - in this league those are
    // routinely different teams, which is the whole reason the scoreboard needs
    // to say it out loud. North Carolina lost by five at TCU and covered; the
    // raw numbers say nothing about that.
    //
    // Gold because it is the board's own colour for "this is the thing that
    // counts", and it only ever appears on a game that is over, so it stays rare.
    // The team names and the scored line come from the ENTRY, not the row. The
    // ticker's payload is a narrow select with no Away, Home or line in it, so
    // reading them off the row worked on the first paint and then quietly undid
    // itself eight seconds later when the ticker came round. None of the three
    // can change once a header is built, so the entry is the right place for
    // them anyway.
    function coveringSide(entry, row){
      if (!entry || !row) return null;
      if (String(row.Status ?? '').trim().toLowerCase() !== 'final') return null;
      const w = row.winner;
      if (w) {
        if (sameTeam(w, entry.homeName)) return 'home';
        if (sameTeam(w, entry.awayName)) return 'away';
      }
      // winner is what the database scored the game on. If it has not landed
      // yet, fall back to the identical sum set_winner_on_final() uses.
      const ln = Number(entry.line), a = Number(row.AwayPts), h = Number(row.HomePts);
      if (!Number.isFinite(ln) || !Number.isFinite(a) || !Number.isFinite(h)) return null;
      return (h + ln) > a ? 'home' : 'away';
    }



    function renderHeader(gameNameMap, gameRows){
      theadRow.innerHTML = '';

      const thTeam = document.createElement('th');
      thTeam.className = 'text-center pl-4 pr-2 py-3 font-semibold text-white bg-[var(--cfp-black)] font-[Oswald] tracking-wide sticky-col-1';
      thTeam.textContent = 'Team';
      theadRow.appendChild(thTeam);

      // The points header also carries the label for the row of banners running
      // along the foot of the game columns. Putting it here rather than inside a
      // banner is what makes it affordable: the banner has about 42px to work
      // with on a phone and "TCU -7.5" already needs 40 of them, so a word in
      // front of it would push every column wider. Out here it costs nothing and
      // labels all four games at once, which is all one label was ever doing.
      const thPts = document.createElement('th');
      thPts.className = 'pl-2 pr-3 py-3 text-center font-semibold text-white bg-[var(--cfp-black)] font-[Oswald] tracking-wide hdr-pts-cell';
      const ptsWrap = document.createElement('div');
      ptsWrap.className = 'hdr-pts';
      const ptsLabel = document.createElement('span');
      ptsLabel.textContent = isTiebreakerView ? (isPhone ? 'TB' : 'Tiebreaks')
                                              : (isPhone ? 'PTS' : 'Points');
      ptsWrap.appendChild(ptsLabel);
      liveTagEl = document.createElement('span');
      liveTagEl.className = 'hdr-pts-live';
      liveTagEl.textContent = 'LIVE';
      liveTagEl.hidden = true;
      ptsWrap.appendChild(liveTagEl);
      thPts.appendChild(ptsWrap);
      theadRow.appendChild(thPts);

      gameIds.forEach(id=>{
        const th = document.createElement('th');
        th.className = 'px-1 py-2 text-center bg-[var(--cfp-black)] align-middle';

        const row = (gameRows||[]).find(g=>g.GameId===id);
        const away = row?.Away || '';
        const home = row?.Home || '';
        const awayAbbr = abbrByTeam[away] || away.substring(0,4).toUpperCase();
        const homeAbbr = abbrByTeam[home] || home.substring(0,4).toUpperCase();
        const awayLogo = logoByTeam[away] || '';
        const homeLogo = logoByTeam[home] || '';
        const aPts = row?.AwayPts ?? '';
        const hPts = row?.HomePts ?? '';
        const status = row?.Status || '';

        const hasUrl = !!(row?.espn_url && /^https?:\/\//i.test(row.espn_url));
        const wrap = document.createElement(hasUrl ? 'a' : 'div');
        wrap.className = 'game-hdr';

        // The channel, above everything else, because it is the one thing you
        // want BEFORE the game rather than during it. Built empty here and
        // filled by paintNetwork, which is also what the ticker calls - the mark
        // arrives from a different feed than the name and can land later.
        const netEl = document.createElement('div');
        netEl.className = 'game-hdr-net';
        const netLogoEl = document.createElement('img');
        netLogoEl.className = 'net-logo';
        netLogoEl.hidden = true;
        netLogoEl.decoding = 'async';
        // The wordmark is only stood down once the image has actually decoded,
        // and goes straight back up if it ever fails. There is no state in which
        // a column loses its channel.
        netLogoEl.addEventListener('load', () => {
          netLogoEl.hidden = false;
          netEl.classList.add('has-logo');
        });
        netLogoEl.addEventListener('error', () => {
          netLogoEl.hidden = true;
          netEl.classList.remove('has-logo');
        });
        const netFullEl = document.createElement('span');
        netFullEl.className = 'net-full';
        const netShortEl = document.createElement('span');
        netShortEl.className = 'net-short';
        // The two characters that stand in for the middle of the ESPN mark. In
        // the DOM for every column and shown for exactly one, so nothing has to
        // be built or torn down when the board re-renders.
        const netRedactEl = document.createElement('span');
        netRedactEl.className = 'net-redact';
        netRedactEl.setAttribute('aria-hidden', 'true');
        netRedactEl.textContent = '**';
        // A wrapper that shrink-wraps the mark, so the asterisks can be
        // positioned against the IMAGE rather than against the column. It has to
        // be: the cut band is centred on the mark only for ESPN itself, and on
        // ESPN2 and ESPN+ it sits well left of centre, so asterisks centred in
        // the column landed on the N instead of in the gap.
        const netMarkEl = document.createElement('span');
        netMarkEl.className = 'net-mark';
        netMarkEl.appendChild(netLogoEl);
        netMarkEl.appendChild(netRedactEl);
        netEl.appendChild(netMarkEl);
        netEl.appendChild(netFullEl);
        netEl.appendChild(netShortEl);
        if (hasUrl) { wrap.href = row.espn_url.trim(); wrap.target = '_blank'; wrap.rel = 'noopener noreferrer'; wrap.style.textDecoration = 'none'; wrap.style.color = 'inherit'; }

        // Line value
        const ln = (typeof row?.line === 'number') ? row.line : (row?.line != null ? Number(row.line) : null);
        const lineTxt = (ln != null && !isNaN(ln)) ? (ln > 0 ? `(+${ln})` : `(${ln})`) : '';

        // Away side
        const awaySide = document.createElement('div');
        awaySide.className = 'game-hdr-side';
        const awaySideTop = document.createElement('div');
        awaySideTop.className = 'game-hdr-side-top';
        if (awayLogo) { const img = document.createElement('img'); img.src = awayLogo; img.className = 'game-hdr-logo'; img.alt = away; awaySideTop.appendChild(img); }
        const awayTeam = document.createElement('div');
        awayTeam.className = 'game-hdr-team';
        const awayAbbrEl = document.createElement('div');
        awayAbbrEl.className = 'game-hdr-abbr';
        awayAbbrEl.textContent = awayAbbr;
        // The team's own colour, lifted only if it cannot be read on this panel -
        // see teamColorOnDark(). Half the palette is a navy or a forest green
        // that would otherwise be invisible here.
        const awayInk = teamColorOnDark(away);
        if (awayInk) awayAbbrEl.style.color = awayInk;
        const awayScoreEl = document.createElement('div');
        awayScoreEl.className = scoreClasses();
        awayTeam.appendChild(awayAbbrEl);
        awayTeam.appendChild(awayScoreEl);
        const awayPossEl = document.createElement('span');
        awayPossEl.className = 'poss-dot';
        awayPossEl.hidden = true;
        awayTeam.appendChild(awayPossEl);
        setScore(awayScoreEl, awayTeam, aPts, false);
        awaySideTop.appendChild(awayTeam);
        awaySide.appendChild(awaySideTop);
        const awayLineRow = document.createElement('div');
        awayLineRow.className = 'game-hdr-line';
        if (ln != null && !isNaN(ln)) {
          const awayLn = -ln;
          const f = document.createElement('span');
          f.className = 'hdr-ln';
          f.textContent = `${awayLn > 0 ? '+' : ''}${awayLn}`;
          awayLineRow.appendChild(f);
        }
        awaySide.appendChild(awayLineRow);
        // The three blocks get their own row so the banner can sit under all of
        // them. On a desktop they are a flex row, and a fourth child would
        // otherwise land beside them rather than beneath.
        const main = document.createElement('div');
        main.className = 'game-hdr-main';
        main.appendChild(awaySide);

        // Center status
        const center = document.createElement('div');
        center.className = 'game-hdr-center';
        paintCenter(center, row);
        main.appendChild(center);

        // Home side
        const homeSide = document.createElement('div');
        homeSide.className = 'game-hdr-side';
        const homeSideTop = document.createElement('div');
        homeSideTop.className = 'game-hdr-side-top';
        const homeTeam = document.createElement('div');
        homeTeam.className = 'game-hdr-team';
        const homeAbbrEl = document.createElement('div');
        homeAbbrEl.className = 'game-hdr-abbr';
        homeAbbrEl.textContent = homeAbbr;
        const homeInk = teamColorOnDark(home);
        if (homeInk) homeAbbrEl.style.color = homeInk;
        const homeScoreEl = document.createElement('div');
        homeScoreEl.className = scoreClasses();
        homeTeam.appendChild(homeAbbrEl);
        homeTeam.appendChild(homeScoreEl);
        const homePossEl = document.createElement('span');
        homePossEl.className = 'poss-dot';
        homePossEl.hidden = true;
        homeTeam.appendChild(homePossEl);
        setScore(homeScoreEl, homeTeam, hPts, false);
        homeSideTop.appendChild(homeTeam);
        if (homeLogo) { const img = document.createElement('img'); img.src = homeLogo; img.className = 'game-hdr-logo'; img.alt = home; homeSideTop.appendChild(img); }
        homeSide.appendChild(homeSideTop);
        const homeLineRow = document.createElement('div');
        homeLineRow.className = 'game-hdr-line';
        if (ln != null && !isNaN(ln)) {
          const f = document.createElement('span');
          f.className = 'hdr-ln';
          f.textContent = `${ln > 0 ? '+' : ''}${ln}`;
          homeLineRow.appendChild(f);
        }
