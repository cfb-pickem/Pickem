  <!-- Cross-document view transitions reject with AbortError whenever a
       navigation interrupts one. It fires from browser internals ~57ms in -
       long before the ES-module graph (and the Supabase bundle behind it) has
       executed - so a listener registered from a module is far too late to
       catch it. Must be a classic script, and it must be here in <head>. -->
  <script>
    addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r && r.name === 'AbortError' && /transition/i.test(r.message || '')) {
        e.preventDefault();
      }
    });
  </script>

    /* --- Pick reveal ------------------------------------------------------ */
    /* A centred stack rather than a row: the clock is the point, so it gets to be
       the biggest thing on screen, and centring means one layout works at 390px
       and 1400px without the pieces wrapping into each other. */

      border:1px solid rgba(255,192,46,.28);
      border-top:2px solid var(--led-amber);
    }
    /* Same LED pitch as the jumbotron, so it reads as part of the same board. */
    .reveal-banner::before{
      content:""; position:absolute; inset:0; pointer-events:none;
      background-image:radial-gradient(circle, var(--panel-dot) 22%, transparent 23%);
      background-size:4px 4px;

  <!-- Instant paint. A classic (non-module) script so it runs the moment the
       parser reaches it - before the module graph, and therefore before the
       Supabase bundle, is fetched. Returning visitors see real standings in the
       first frame instead of a skeleton. Written by saveSnapshot() below. -->
  <script id="instant-paint">
    (function () {
      try {
        var raw = localStorage.getItem('cfb_snapshot_v1');
        if (!raw) return;
        var snap = JSON.parse(raw);
        if (!snap || snap.v !== 2 || !snap.bodyHtml) return;
        if (Date.now() - (snap.savedAt || 0) > 7 * 24 * 60 * 60 * 1000) return;

        var head = document.getElementById('thead-row');
        var body = document.getElementById('tbody');
        var table = document.getElementById('leaderboard-table');
        var skel = document.getElementById('table-loading');
        if (!head || !body || !table) return;

        head.innerHTML = snap.headHtml || '';
        body.innerHTML = snap.bodyHtml;
        if (skel) skel.style.display = 'none';
        table.style.display = '';

        var ws = document.getElementById('weekly-submissions');
        if (ws && !snap.wsVisible) ws.style.display = 'none';

        var st = document.getElementById('status');
        if (st) st.textContent = (snap.statusText || 'Standings') + ' · refreshing…';

        window.__cfbPaintedFromCache = true;
      } catch (e) { /* corrupt or unavailable storage - fall through to normal load */ }
    })();

  </script>

    });

    let liveTimer = null;
    // Adaptive score polling. A fixed 30s tick was both too slow while games are
    // actually in progress and pure waste the rest of the year. The ESPN job
    // refreshes the database once a minute, so LIVE_MS is the useful floor.
    const LIVE_MS_ACTIVE = 15000;  // something is in progress
    const LIVE_MS_IDLE   = 90000;  // everything final / nothing kicked off yet
    let liveIntervalMs = LIVE_MS_IDLE;

    const headerStatusEls = new Map();

    // Perf cache
    const STORAGE_KEYS = {
      lastSeason: 'cfb_last_season_v1',
      lastWeek:   'cfb_last_week_v1',
      logos: 'cfb_logos_v1',
      logosTTL: 'cfb_logos_ttl_v1',
      abbrev: 'cfb_abbrev_v1',
      abbrevTTL: 'cfb_abbrev_ttl_v1',
    };
    const LOGOS_TTL_MS = 7 * 24 * 60 * 60 * 1000;

    function getCached(key) {
      const v = localStorage.getItem(key);
      return v ? Number(v) : null;
    }
    function setCached(key, val) {
      if (Number.isFinite(val)) localStorage.setItem(key, String(val));
    }
    function getCachedMap(key, ttlKey){
      try{
        const ttl = Number(localStorage.getItem(ttlKey) || 0);
        if (Date.now() > ttl) return null;
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      }catch{ return null; }
    }
    function setCachedMap(key, ttlKey, obj){
      try{
        localStorage.setItem(key, JSON.stringify(obj || {}));
        localStorage.setItem(ttlKey, String(Date.now() + LOGOS_TTL_MS));
      }catch{}
    }

    // ---- Instant paint: last-known standings ----------------------------------
    // saveSnapshot() stores the *rendered* table HTML. A tiny classic script in the
    // body (see #instant-paint) injects it before this module - and therefore
    // before the Supabase bundle - is even fetched, so a returning visitor sees
    // real standings in the first frame. Live data overwrites it moments later.
    //
    // The stored HTML is our own serialised DOM, built with textContent, so team
    // names are already escaped.
    const SNAPSHOT_KEY = 'cfb_snapshot_v1';
    const paintedFromCache = !!window.__cfbPaintedFromCache;

    function saveSnapshot(){
      try{
        localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({
          v: 2,
          savedAt: Date.now(),
          headHtml: theadRow.innerHTML,
          bodyHtml: tbody.innerHTML,
          wsVisible: gameIds.length > 0,
          statusText: statusEl ? statusEl.textContent : '',
        }));
      }catch{ /* quota or private mode - caching is best-effort */ }
    }

    const statusSpinner = document.getElementById('status-spinner');
    const tableLoading  = document.getElementById('table-loading');
    const leaderboardTable = document.getElementById('leaderboard-table');

    function status(msg,isErr=false,loading=false){
      statusEl.className = 'text-sm ' + (isErr ? 'text-red-300' : 'text-gray-300');
      statusEl.textContent = msg;
      if (statusSpinner) statusSpinner.style.display = loading ? '' : 'none';
    }

    function showTable(){
      if (tableLoading) tableLoading.style.display = 'none';
      if (leaderboardTable) leaderboardTable.style.display = '';
    }

    // Hide the Week control (and its label) when the season has no weeks yet.
    function setWeekPickerVisible(visible){
      const sel = document.getElementById('week-select');
      const lbl = document.getElementById('week-label');
      if (sel) sel.style.display = visible ? '' : 'none';
      if (lbl) lbl.style.display = visible ? '' : 'none';
    }

    // The Made Picks / Not Yet panel is meaningless when no games are picked.
    function setWeeklySubmissionsVisible(visible){
      const el = document.getElementById('weekly-submissions');
      if (el) el.style.display = visible ? '' : 'none';
    }

    // Always format using Central Time
    function formatTimeCentral(ts){
      if (!ts) return '';
      try{
        const d = (ts instanceof Date) ? ts : new Date(ts);
        return d.toLocaleTimeString('en-US', {
          hour:'2-digit',
          minute:'2-digit',
          timeZone: CENTRAL_TZ,
        });
      }catch{
        return '';
      }
    }

    function teamLabel(name){
      if (isPhone && abbrByTeam[name]) return abbrByTeam[name];
      return name;
    }
    function buildGameNameMap(games){
      const map = {};
      games.forEach(g=>{
        const ln = (typeof g.line === 'number') ? g.line : (g.line!=null? Number(g.line): null);
        const lineTxt = (ln!=null && !isNaN(ln)) ? (ln>0?` (+${ln})`:` (${ln})`) : '';
        map[g.GameId] = `${teamLabel(g.Away)} @ ${teamLabel(g.Home)}${lineTxt}`;
      });
      return map;
    }

    function getPointsMapForCurrentView(){
      return isPlayoffView ? winsByTeamPlayoff : winsByTeamRegular;
    }
    function getPoints(pointsMap, teamId){
      return (pointsMap && pointsMap[teamId]) || 0;
    }

    // Load current user's team
    async function loadCurrentUserTeam(){
      try{
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) return;
        isSignedIn = true;

        const { data: myTeams, error: tErr } = await supabase
          .from('teams')
          .select('team_id, team_name')
          .eq('user_id', session.user.id)
          .order('team_name', { ascending: true });

        if (tErr) {
          console.warn('loadCurrentUserTeam error:', tErr.message);
          return;
        }
        if (myTeams && myTeams.length){
          currentTeamId = myTeams[0].team_id;
        }
      }catch(e){
        console.warn('loadCurrentUserTeam exception:', e);
      }
    }

    // Startup
    async function startup() {
      initMascots();


      // initNav(), loadCurrentUserTeam() and init() (logos/abbreviations) are
      // independent of each other and of the season. Awaiting them one at a time
      // cost four sequential round trips before the first row could render, so
      // they're kicked off together and joined once the week is known.
      const navReady    = initNav().catch(e => console.warn('nav init failed:', e));
      const userReady   = loadCurrentUserTeam().catch(e => console.warn('user team load failed:', e));
      const assetsReady = init().catch(e => console.warn('asset load failed:', e));

      await loadSeasons();
      const hintedSeason = getCached(STORAGE_KEYS.lastSeason);
      if (Number.isFinite(hintedSeason) && seasons.includes(hintedSeason)) {
        currentSeason = hintedSeason;
      } else {
        currentSeason = seasons[seasons.length-1];
      }
      seasonSelect.value = String(currentSeason);

      // IMPORTANT: loadWeeksForSeason now RETURNS maxPickedWeek
      const maxPickedWeek = await loadWeeksForSeason(currentSeason);

      // Default behavior:
      // - If max picked week > 15, default to playoff
      // - Else default to max picked regular week (week 1-15)
      if (Number.isFinite(maxPickedWeek) && maxPickedWeek > 15) {
        currentWeek = 'playoff';
        isPlayoffView = true;
        weekSelect.value = 'playoff';
        localStorage.removeItem(STORAGE_KEYS.lastWeek);
      } else if (Number.isFinite(maxPickedWeek)) {
        currentWeek = maxPickedWeek;
        isPlayoffView = false;
        weekSelect.value = String(currentWeek);
        setCached(STORAGE_KEYS.lastWeek, currentWeek);
      } else {
        currentWeek = null;
        isPlayoffView = false;
      }

      // Rendering needs the current user's team (row highlight) and the logo map.
      await Promise.all([navReady, userReady, assetsReady]);

      // ✅ Compute points based on selected view
      if (isPlayoffView) {
        await computePlayoffWins();
      } else if (Number.isFinite(currentWeek)) {
        await computeSeasonWinsThroughWeek(currentWeek);
      } else {
        winsByTeamRegular = Object.create(null);
      }

      if (isPlayoffView) {
        await loadPlayoffWeek();
      } else if (currentWeek != null) {
        await loadWeek(currentWeek);
      } else {
        await loadTeamsOnly();
      }

      seasonSelect.onchange = async () => {
        ++loadSeq;                       // abandon anything already in flight
        currentSeason = Number(seasonSelect.value);
        setCached(STORAGE_KEYS.lastSeason, currentSeason);

        const maxPickedWeek2 = await loadWeeksForSeason(currentSeason);

        if (Number.isFinite(maxPickedWeek2) && maxPickedWeek2 > 15) {
          currentWeek = 'playoff';
          isPlayoffView = true;
          weekSelect.value = 'playoff';
          localStorage.removeItem(STORAGE_KEYS.lastWeek);
        } else if (Number.isFinite(maxPickedWeek2)) {
          currentWeek = maxPickedWeek2;
          isPlayoffView = false;
          weekSelect.value = String(currentWeek);
          setCached(STORAGE_KEYS.lastWeek, currentWeek);
        } else {
          currentWeek = null;
          isPlayoffView = false;
          weekSelect.value = '';
        }

        // ✅ Recompute points
        if (isPlayoffView) {
          await computePlayoffWins();
          await loadPlayoffWeek();
        } else if (Number.isFinite(currentWeek)) {
          await computeSeasonWinsThroughWeek(currentWeek);
          await loadWeek(currentWeek);
        } else {
          await loadTeamsOnly();
        }
      };

      weekSelect.onchange = async ()=> {
        ++loadSeq;                       // abandon anything already in flight
        const val = weekSelect.value;
        if (val === '') return;          // week picker was cleared by a season change
        if (val === 'playoff') {
          currentWeek = 'playoff';
          isPlayoffView = true;
          localStorage.removeItem(STORAGE_KEYS.lastWeek);
          await computePlayoffWins();
          await loadPlayoffWeek();
        } else {
          currentWeek = Number(val);
          isPlayoffView = false;
          setCached(STORAGE_KEYS.lastWeek, currentWeek);
          await computeSeasonWinsThroughWeek(currentWeek);
          await loadWeek(currentWeek);
        }
      };
    }
    startup();

    // Loaders
    // ---- Season data cache --------------------------------------------------
    // Loading the leaderboard used to take five serial round trips: the week
    // list, then the decided games, then their picks, then this week's games,
    // then its picks. Each costs ~130ms of network for ~0.2ms of database work,
    // and every one of them is a slice of the same two sets. So both are fetched
    // once per season and sliced locally: five round trips become two.
    let seasonCache = { season: null, games: null, picks: null };

    async function loadSeasonData(season){
      if (seasonCache.season === season && seasonCache.games) return seasonCache;

      const { data: games, error: gErr } = await supabase
        .from('all_games')
        .select('GameId, Away, Home, AwayPts, HomePts, line, winner, Status, Period, Clock, "Start (CT)", Network, picked, week, espn_url, cfb_season, tiebreaker')
        .eq('cfb_season', season)
        .eq('picked', true);
      if (gErr){ status('Could not load the season schedule.', true); return null; }

      const ids = (games || []).map(g => g.GameId);
      let picks = [];
      if (ids.length){
        const { data: p, error: pErr } = await supabase
          .from('picks').select('team_id, game_id, pick').in('game_id', ids);
        if (pErr){ status('Could not load picks.', true); return null; }
        picks = p || [];
      }

      seasonCache = { season, games: games || [], picks };
      return seasonCache;
    }

    // A team belongs on a season's board if it's still playing, OR if it played
    // that season. That way someone sitting out drops off the current
    // leaderboard without vanishing from the years they did play.
    function teamsForSeason(rows){
      const played = new Set((seasonCache.picks || []).map(p => Number(p.team_id)));
      return (rows || []).filter(t => t.active !== false || played.has(Number(t.team_id)));
    }

    // Picks for a given set of games, from the cache.
    function picksForGames(ids){
      const want = new Set(ids.map(Number));
      return (seasonCache.picks || []).filter(p => want.has(Number(p.game_id)));
    }

    async function loadSeasons(){
      if(!paintedFromCache) status('Loading seasons…', false, true);

      let data = await (window.__cfbPreload?.seasons ?? Promise.resolve(null));
      if(!data){
        const res = await supabase
          .from('all_games')
          .select('cfb_season')
          .not('cfb_season', 'is', null);
        if(res.error){ status(res.error.message, true); throw res.error; }
        data = res.data;
      }
      seasons = [...new Set((data||[]).map(r => Number(r.cfb_season)).filter(Number.isFinite))].sort((a,b)=>a-b);
      if(!seasons.length) { status('No seasons found.'); throw new Error('no seasons'); }
      seasonSelect.innerHTML = seasons.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    // UPDATED: returns maxPickedWeek
    async function loadWeeksForSeason(season){
      status(`Loading weeks for ${season}…`);
      const cache = await loadSeasonData(season);
      if (!cache) throw new Error('season load failed');

      const uniqueWeeks = [...new Set(cache.games
        .map(r => Number(r.week)).filter(Number.isFinite))].sort((a,b)=>a-b);

      if (!uniqueWeeks.length){
        weeks = [];
        weekSelect.innerHTML = '';
        hasPlayoffOption = false;
        // An empty dropdown just reads as broken - hide it until there are weeks.
        setWeekPickerVisible(false);
        return null;
      }

      const maxPickedWeek = uniqueWeeks[uniqueWeeks.length - 1];
      hasPlayoffOption = maxPickedWeek > 15;

      const regularWeeks = uniqueWeeks.filter(w => w <= 15);
      weeks = regularWeeks;

      let html = '';
      if (regularWeeks.length){
        html += regularWeeks.map(w=>`<option value="${w}">Week ${w}</option>`).join('');
      }
      if (hasPlayoffOption){
        html += `<option value="playoff">Playoff</option>`;
      }

      weekSelect.innerHTML = html;
      setWeekPickerVisible(true);
      return maxPickedWeek;
    }

    async function init(){
      if(!paintedFromCache) status('Loading assets…');

      const logoCached = getCachedMap(STORAGE_KEYS.logos, STORAGE_KEYS.logosTTL);
      const abbrCached = getCachedMap(STORAGE_KEYS.abbrev, STORAGE_KEYS.abbrevTTL);
      if (logoCached) logoByTeam = logoCached;
      if (abbrCached) abbrByTeam = abbrCached;

      let logoRows = await (window.__cfbPreload?.logos ?? Promise.resolve(null));
      let lErr = null;
      if(!logoRows){
        const res = await supabase.from('logos').select('Team, LogoURL, Abbrev');
        logoRows = res.data; lErr = res.error;
      }

      if(!lErr) {
        const mergedLogos = { ...(logoCached || {}) };
        const mergedAbbrs = { ...(abbrCached || {}) };
        (logoRows || []).forEach(r => {
          if (r?.Team) {
            if (r.LogoURL) mergedLogos[r.Team] = r.LogoURL;
            if (r.Abbrev)  mergedAbbrs[r.Team] = r.Abbrev;
          }
        });
        logoByTeam = mergedLogos;
        abbrByTeam = mergedAbbrs;
        setCachedMap(STORAGE_KEYS.logos,  STORAGE_KEYS.logosTTL,  logoByTeam);
        setCachedMap(STORAGE_KEYS.abbrev, STORAGE_KEYS.abbrevTTL, abbrByTeam);
      }
    }

    // -------- Points (EXCLUDING tiebreakers) --------
    // ✅ Regular season wins THROUGH selected week (1..15, or 0..15 if you have week 0)
    async function computeSeasonWinsThroughWeek(throughWeek){
      if (!Number.isFinite(throughWeek)) {
        winsByTeamRegular = Object.create(null);
        return;
      }

      const cache = await loadSeasonData(currentSeason);
      if (!cache) return;

      const decidedGames = cache.games.filter(g =>
        Number(g.week) <= throughWeek && Number(g.week) <= 15 &&
        g.winner != null && g.tiebreaker !== true);

      const gameIdsSeason = decidedGames.map(g => g.GameId);
      const winnerByGame = Object.create(null);
      (decidedGames||[]).forEach(g=>{ winnerByGame[g.GameId] = g.winner; });

      if (!gameIdsSeason.length){
        winsByTeamRegular = Object.create(null);
        return;
      }

      const allPicks = picksForGames(gameIdsSeason);

      const map = Object.create(null);
      (allPicks||[]).forEach(p=>{
        const winner = winnerByGame[p.game_id];
        if(!winner) return;
        if(sameTeam(p.pick, winner)){
          map[p.team_id] = (map[p.team_id] || 0) + 1;
        }
      });

      winsByTeamRegular = map;
    }

    async function computePlayoffWins(){
      const { data: decidedGames, error: dgErr } = await supabase
        .from('all_games')
        .select('GameId, winner, week')
        .eq('cfb_season', currentSeason)
        .gt('week', 15)
        .not('winner', 'is', null)
        .or('tiebreaker.is.null,tiebreaker.eq.false');

      if(dgErr){ status(dgErr.message, true); return; }

      const gameIdsPo = (decidedGames || []).map(g => g.GameId);
      const winnerByGame = Object.create(null);
      (decidedGames||[]).forEach(g=>{ winnerByGame[g.GameId] = g.winner; });

      if (!gameIdsPo.length){
        winsByTeamPlayoff = Object.create(null);
        return;
      }

      const { data: allPicks, error: pErr } = await supabase
        .from('picks')
        .select('team_id, game_id, pick')
        .in('game_id', gameIdsPo);
      if(pErr){ status(pErr.message, true); return; }

      const map = Object.create(null);
      (allPicks||[]).forEach(p=>{
        const winner = winnerByGame[p.game_id];
        if(!winner) return;
        if(sameTeam(p.pick, winner)){
          map[p.team_id] = (map[p.team_id] || 0) + 1;
        }
      });
      winsByTeamPlayoff = map;
    }

    // Week loaders
    // No games have been picked for this season yet — pre-season, or the
    // commissioner hasn't selected games. Show the full roster with a zeroed
    // scoreboard rather than leaving the loading skeleton up forever.
    async function loadTeamsOnly(){
      status(`Loading Season ${currentSeason}…`, false, true);
      isPlayoffView = false;
      stopLiveTicker();
      headerStatusEls.clear();

      lastGames   = [];
      gameIds     = [];
      winnerMap   = {};
      lineMap     = {};
      weekStartTs = null;
      gameStartTs = {};
      showPicks   = true;
      winsByTeamRegular = Object.create(null);
      updateSeasonalTheme(currentSeason, []);

      let teamRows = await (window.__cfbPreload?.teams ?? Promise.resolve(null));
      if(!teamRows){
        const res = await supabase
          .from('teams')
          .select('team_id, team_name, active')
          .order('team_name', { ascending: true });
        if (res.error) return status(res.error.message, true);
        teamRows = res.data;
      }

      // No picked games this season, so nobody can have played it: active only.
      const teams = (teamRows || []).filter(t => t.active !== false)
        .sort((a, b) => (a.team_name || '').localeCompare(b.team_name || ''));

      lastTeams   = teams;
      lastPickMap = {};

      // gameIds is empty, so these render a plain Team + Points table.
      renderHeader({}, []);
      renderTable(teams, {}, {}, true, winsByTeamRegular, false);
      setWeeklySubmissionsVisible(false);
      showTable();

      status(teams.length
        ? `Season ${currentSeason} — no games picked yet. Showing all ${teams.length} teams.`
        : `Season ${currentSeason} — no teams have been created yet.`);
      saveSnapshot();
    }

    async function loadWeek(week){
      // Number(null) is 0, which is finite - so this has to test for null first.
      if (week == null || !Number.isFinite(Number(week))) return;
      const mySeq = loadSeq;
      status(`Loading S${currentSeason} • Week ${week}…`);
      isPlayoffView = false;
      stopLiveTicker();
      headerStatusEls.clear();

      const cache = await loadSeasonData(currentSeason);
      if(!cache) return;
      if(mySeq !== loadSeq) return;   // a newer selection won
      const gamesRaw = cache.games.filter(g => Number(g.week) === Number(week));

      const games = (gamesRaw || []).slice().sort((a, b) => {
        const ta = kickoffMs(a) ?? Infinity;
        const tb = kickoffMs(b) ?? Infinity;
        return ta - tb;
      });
      lastGames = games;
      updateSeasonalTheme(currentSeason, games);

      weekStartTs = null;
      gameStartTs = {};
      for (const g of games) {
        const ts = kickoffMs(g);
        if (Number.isFinite(ts)) {
          gameStartTs[g.GameId] = ts;
          weekStartTs = (weekStartTs==null) ? ts : Math.min(weekStartTs, ts);
        }
      }
      // Reveal uses the exact predicate picks.html locks on, so the board can
      // never show a pick that is still editable. Unknown kickoff -> stay hidden.
      showPicks = isWeekLocked(games);

      winnerMap = {}; lineMap = {};
      gameIds = games.map(g=>g.GameId);
      games.forEach(g=>{
        winnerMap[g.GameId] = g.winner ?? null;
        lineMap[g.GameId]   = (typeof g.line === 'number') ? g.line : (g.line!=null? Number(g.line): null);
      });

      let teamRows = await (window.__cfbPreload?.teams ?? Promise.resolve(null));
      if(!teamRows){
        const res = await supabase
          .from('teams')
          .select('team_id, team_name, active')
          .order('team_name', { ascending: true });
        if(res.error) return status(res.error.message, true);
        teamRows = res.data;
      }

      const pickRows = picksForGames(gameIds);

      const pickMap = buildPickMap(pickRows);

      // ✅ Points for non-playoff view already computed through currentWeek
      const pointsMap = winsByTeamRegular;
      const teamsSorted = [...teamsForSeason(teamRows)].sort((a,b)=>{
        const pa = getPoints(pointsMap, a.team_id);
        const pb = getPoints(pointsMap, b.team_id);
        if(pb !== pa) return pb - pa;
        return a.team_name.localeCompare(b.team_name);
      });

      lastTeams = teamsSorted;
      lastPickMap = pickMap;

      const gameNameMap = buildGameNameMap(games);
      renderHeader(gameNameMap, games);
      renderTable(teamsSorted, pickMap, winnerMap, showPicks, pointsMap, false);
      await renderWeeklySubmissions(teamsSorted, pickMap);
      showTable();

      saveSnapshot();
      startLiveTicker();
      startRevealCountdown();
      if (!showPicks && weekStartTs) {
        status(`Picks hidden until kickoff at ${formatTimeCentral(weekStartTs)} CT • Season ${currentSeason} • Week ${week}`);
      } else {
        status(`Season ${currentSeason} • Week ${week}`);
      }
    }

    async function loadPlayoffWeek(){
      const mySeq = loadSeq;
      status(`Loading S${currentSeason} • Playoff…`);
      isPlayoffView = true;
      stopLiveTicker();
      headerStatusEls.clear();

      const cache = await loadSeasonData(currentSeason);
      if(!cache) return;
      if(mySeq !== loadSeq) return;
      const gamesRaw = cache.games.filter(g => Number(g.week) > 15);

      const games = (gamesRaw || []).slice().sort((a, b) => {
        const ta = kickoffMs(a) ?? Infinity;
        const tb = kickoffMs(b) ?? Infinity;
        return ta - tb;
      });
      lastGames = games;
      updateSeasonalTheme(currentSeason, games);

      weekStartTs = null;
      gameStartTs = {};
      for (const g of games) {
        const ts = kickoffMs(g);
        if (Number.isFinite(ts)) {
          gameStartTs[g.GameId] = ts;
          weekStartTs = (weekStartTs==null) ? ts : Math.min(weekStartTs, ts);
        }
      }
      showPicks = true;

      winnerMap = {}; lineMap = {};
      gameIds = games.map(g=>g.GameId);
      games.forEach(g=>{
        winnerMap[g.GameId] = g.winner ?? null;
        lineMap[g.GameId]   = (typeof g.line === 'number') ? g.line : (g.line!=null? Number(g.line): null);
      });

      const { data: playoffRows, error: poErr } = await supabase
        .from('playoffs')
        .select('team_id, seed, teams ( team_name )')
        .eq('season', currentSeason)
        .order('seed', { ascending: true });
      if (poErr) return status('Could not load playoff seeds.', true);
      if(mySeq !== loadSeq) return;

      let playoffTeams = (playoffRows || []).map(r => ({
        team_id: r.team_id,
        team_name: r.teams?.team_name || `Team ${r.team_id}`,
        seed: r.seed
      }));

      // No seeds configured for this season: fall back to the full roster so the
      // table isn't rendered with game columns and no rows.
      let seedsMissing = false;
      if (!playoffTeams.length) {
        seedsMissing = true;
        const { data: allTeams, error: atErr } = await supabase
          .from('teams')
          .select('team_id, team_name, active')
          .order('team_name', { ascending: true });
        if (atErr) return status('Could not load teams.', true);
        playoffTeams = teamsForSeason(allTeams).map(t => ({
          team_id: t.team_id,
          team_name: t.team_name,
          seed: null
        }));
      }

      const pickRows = picksForGames(gameIds);

      const pickMap = buildPickMap(pickRows);

      const pointsMap = winsByTeamPlayoff;
      const teamsSorted = [...playoffTeams].sort((a,b)=>{
        const pa = getPoints(pointsMap, a.team_id);
        const pb = getPoints(pointsMap, b.team_id);
        if (pb !== pa) return pb - pa;
        if ((a.seed ?? Infinity) !== (b.seed ?? Infinity)) {
          return (a.seed ?? Infinity) - (b.seed ?? Infinity);
        }
        return a.team_name.localeCompare(b.team_name);
      });

      lastTeams = teamsSorted;
      lastPickMap = pickMap;

      const gameNameMap = buildGameNameMap(games);
      renderHeader(gameNameMap, games);
      renderTable(teamsSorted, pickMap, winnerMap, true, pointsMap, true);
      await renderWeeklySubmissions(teamsSorted, pickMap);
      showTable();

      saveSnapshot();
      startLiveTicker();
      status(seedsMissing
        ? `Season ${currentSeason} • Playoff — no seeds set, showing all teams.`
        : `Season ${currentSeason} • Playoff`);
    }

    function getLogoForPickExact(pick){
      if(!pick) return null;
      return logoByTeam[pick] || null;
    }

    function scoreClasses(status, aPts, hPts, side){
      const base = 'game-hdr-score';
      if (status === 'final') {
        const a = Number(aPts), h = Number(hPts);
        if (isNaN(a) || isNaN(h)) return base;
        if (side === 'away') return base + (a >= h ? ' score-win' : ' score-loss');
        return base + (h >= a ? ' score-win' : ' score-loss');
      }
      if (status === 'in_progress') {
        const a = Number(aPts), h = Number(hPts);
        if (isNaN(a) || isNaN(h)) return base;
        if (side === 'away') return base + (a >= h ? ' score-lead' : ' score-trail');
        return base + (h >= a ? ' score-lead' : ' score-trail');
      }
      return base;
    }

        homeTeam.appendChild(homeScoreEl);

    function renderTable(teams, pickMap, winnerMap, revealPicks, pointsMap, playoffMode){
      tbody.innerHTML = '';

      const pointsArray = teams.map(t => getPoints(pointsMap, t.team_id));
      const cutoffPts = pointsArray.length ? (pointsArray[Math.min(3, pointsArray.length - 1)] || 0) : 0;

      let lastCutIndex = -1;
      for(let i = 0; i < teams.length; i++){
        if(getPoints(pointsMap, teams[i].team_id) >= cutoffPts){
          lastCutIndex = i;
        } else break;
      }

      const shouldInsertDivider = lastCutIndex >= 0 && lastCutIndex < teams.length - 1;

      teams.forEach((team, idx)=>{
        const tr = document.createElement('tr');
        tr.className = 'border-t border-[rgba(231,231,231,.08)] hover:bg-[rgba(233,185,73,.04)]';

        if (currentTeamId != null && team.team_id === currentTeamId) {
          tr.dataset.me = 'true';
        }

        // The name is the way in to a player's scouting report. It stays a plain
        // name visually - a dotted gold underline is the only hint - because the
        // board is still the point of this page.
        //
        // Two people never get that link. Signed-out visitors, because the board
        // is public but scouting is for members. And YOU, on your own row: being
        // able to read your own report would let you see the model's call on
        // yourself and pick against it purely to stay unreadable, which poisons
        // the data everyone else's report is built from.
        const tdTeam = document.createElement('td');
        tdTeam.className = 'pl-4 pr-2 py-2 font-semibold text-[var(--cfp-ivory)] sticky-col-1';
        const isSelf = currentTeamId != null && team.team_id === currentTeamId;
        if (isSignedIn && !isSelf) {
          const scoutBtn = document.createElement('button');
          scoutBtn.type = 'button';
          scoutBtn.className = 'scout-link';
          scoutBtn.textContent = team.team_name;
          scoutBtn.addEventListener('click', () => {
            openScoutPanel({
              teamId: team.team_id,
              teamName: team.team_name,
              games: lastGames,
              season: currentSeason,
              revealed: revealPicks,
              pickMap,
              viewerTeamId: currentTeamId
            });
          });
          tdTeam.appendChild(scoutBtn);
        } else {
          tdTeam.textContent = team.team_name;
          if (isSelf) tdTeam.title = 'You cannot scout yourself';
        }
        tr.appendChild(tdTeam);

        const tdPts = document.createElement('td');
        tdPts.className = 'pl-2 pr-3 py-2 text-center font-semibold text-[var(--cfp-ivory)]';
        tdPts.textContent = getPoints(pointsMap, team.team_id).toString();
        tr.appendChild(tdPts);

        gameIds.forEach(id=>{
          const td = document.createElement('td');
          td.className = 'px-3 py-2 text-center text-sm align-middle';

          const shouldRevealThisGame = playoffMode
            ? (() => {
                // Playoffs stay per-game: each unlocks at its own kickoff.
                const ts = gameStartTs[id];
                if (!ts) return false; // unknown kickoff -> keep it hidden
                return Date.now() >= ts;
              })()
            : revealPicks;

          if(!shouldRevealThisGame){
            td.classList.add('pick-empty');
            td.textContent = '—';
            tr.appendChild(td);
            return;
          }

          const pick   = pickMap[team.team_id]?.[id];
          const winner = winnerMap[id];
          const hasPick = !!(pick && String(pick).trim() !== '');

          if(hasPick){
            if(winner && sameTeam(pick, winner)){
              td.classList.add('pick-win');
            }else if(winner && !sameTeam(pick, winner)){
              td.classList.add('pick-loss');
            }else{
              td.classList.add('pick-empty');
            }
          }else{
            td.classList.add('pick-empty');
          }

          const url = hasPick ? getLogoForPickExact(pick) : null;
          if(url){
            const img = document.createElement('img');
            img.src = url;
            img.alt = pick;
            img.title = pick;
            img.loading = 'lazy';
            img.className = 'logo';
            td.appendChild(img);
          }else{
            td.textContent = hasPick ? pick : '—';
          }

          tr.appendChild(td);
        });

        tbody.appendChild(tr);

        if(shouldInsertDivider && idx === lastCutIndex){
          const divTr = document.createElement('tr');
          divTr.className = 'playoff-divider';
          const divTd = document.createElement('td');
          divTd.colSpan = 2 + gameIds.length;
          // In a span so CSS can pin it to the left edge - centring on the full
          // table width pushed the label off-screen whenever the week had enough
          // games to make the table scroll.
          const divLabel = document.createElement('span');
          divLabel.className = 'playoff-divider-label';
          divLabel.textContent = 'Projected Playoff';
          divTd.appendChild(divLabel);
          divTr.appendChild(divTd);
          tbody.appendChild(divTr);
        }
      });
    }

    // Who has submitted this week.
    //
    // This can no longer be worked out from pickMap: the database now hides other
    // teams' picks until the week locks, which is the whole point - so before
    // kickoff pickMap legitimately contains only your own. submission_status() is
    // a SECURITY DEFINER function that answers "has this team submitted?" with a
    // boolean and never returns a pick value, so the panel keeps working without
    // reopening the hole.
    async function renderWeeklySubmissions(teams, pickMap){
      setWeeklySubmissionsVisible(true);
      const made = [];
      const notYet = [];

      let status = null;
      if (!isPlayoffView && Number.isFinite(Number(currentWeek))) {
        const { data, error } = await supabase.rpc('submission_status', {
          p_season: currentSeason, p_week: Number(currentWeek)
        });
        if (!error && Array.isArray(data)) status = data;
      }

      if (status) {
        const byId = new Map(status.map(r => [Number(r.team_id), r.submitted]));
        teams.forEach(t => (byId.get(Number(t.team_id)) ? made : notYet).push(t.team_name));
      } else {
        // Playoff view, or the RPC failed: fall back to what we can see locally.
        teams.forEach(t=>{
          const picks = pickMap[t.team_id] || {};
          const hasCompleteSubmission = gameIds.length === 0 ? false : gameIds.every(id=>{
            const p = picks[id];
            return p && String(p).trim() !== '';
          });
          (hasCompleteSubmission ? made : notYet).push(t.team_name);
        });
      }

      wsMade.innerHTML = made.map(name =>
        `<span class="badge badge-sched inline-fix rounded-full">${escapeHtml(name)}</span>`
      ).join('') || `<span class="text-gray-400">—</span>`;

      wsNot.innerHTML = notYet.map(name =>
        `<span class="badge badge-sched inline-fix rounded-full">${escapeHtml(name)}</span>`
      ).join('') || `<span class="text-gray-400">—</span>`;
    }

    // ---- Pick reveal ---------------------------------------------------------
    // The moment the first game kicks is the best beat of the week, and it used
    // to just... happen. Now it counts down, escalates, and flips the whole board
    // over at once.
    const revealBanner = document.getElementById('reveal-banner');
    const revealClock  = document.getElementById('reveal-clock');
    const revealSub    = document.getElementById('reveal-sub');
    let revealTimer = null;
    let pendingRevealAnimation = false;

    function firstGameLabel(){
      const ts = earliestKickoffMs(lastGames);
      if (ts == null) return '';
      let first = null;
      for (const g of lastGames){
        if (kickoffMs(g) === ts) { first = g; break; }
      }
      if (!first) return '';
      return `${first.Away} @ ${first.Home} • ${formatTimeCentral(ts)} CT`;
    }

    function stopRevealCountdown(){
      if (revealTimer){ clearInterval(revealTimer); revealTimer = null; }
      revealBanner?.classList.add('hidden');
      revealBanner?.classList.remove('is-urgent','is-imminent');
    }

    function tickRevealCountdown(){
      if (!revealBanner) return;
      const ts = earliestKickoffMs(lastGames);
      if (ts == null || showPicks || isPlayoffView){ stopRevealCountdown(); return; }

      let ms = ts - Date.now();
      if (ms <= 0){ stopRevealCountdown(); revealNow(); return; }

      const s   = Math.floor(ms / 1000);
      const d   = Math.floor(s / 86400);
      const h   = Math.floor((s % 86400) / 3600);
      const m   = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const p2  = n => String(n).padStart(2, '0');

      // Labelled units, and always down to seconds - without a moving seconds
      // digit the clock looks frozen when you're days out, which kills the whole
      // point. Units are rendered smaller than the numbers so the digits stay
      // the loud part. Numbers only, so innerHTML is safe here.
      const part = (v, u) => `<span class="cd-n">${v}</span><span class="cd-u">${u}</span>`;
      let html, units;
      if (d > 0)      { html = part(d,'d') + part(p2(h),'h') + part(p2(m),'m') + part(p2(sec),'s'); units = 4; }
      else if (h > 0) { html = part(h,'h')  + part(p2(m),'m') + part(p2(sec),'s');                  units = 3; }
      else if (m > 0) { html = part(m,'m')  + part(p2(sec),'s');                                    units = 2; }
      else            { html = part(sec,'s');                                                       units = 1; }
      revealClock.innerHTML = html;
      revealClock.classList.toggle('is-long', units >= 4);

      // Escalate as it closes in.
      const isOpener = Number(currentWeek) === 0;
      const label = revealBanner.querySelector('.reveal-label');
      const eyebrow = document.getElementById('reveal-eyebrow');

      revealBanner.classList.toggle('is-opener',   isOpener);
      revealBanner.classList.toggle('is-urgent',   ms <= 60 * 60 * 1000);
      revealBanner.classList.toggle('is-imminent', ms <= 5  * 60 * 1000);
      if (eyebrow) eyebrow.hidden = !isOpener;

      if (label){
        label.textContent =
            ms <= 5 * 60 * 1000  ? (isOpener ? 'Football is back in' : 'Locking now')
          : ms <= 60 * 60 * 1000 ? (isOpener ? 'First kick in'       : 'Picks lock in')
          : isOpener             ? 'Season kicks off in'
          :                        'Picks reveal in';
      }

      // The opener always shows what it's counting down to; a normal week only
      // bothers inside the last hour.
      revealSub.textContent = (isOpener || ms <= 60 * 60 * 1000) ? firstGameLabel() : '';
    }

    function startRevealCountdown(){
      stopRevealCountdown();
      if (!revealBanner || showPicks || isPlayoffView) return;
      if (earliestKickoffMs(lastGames) == null) return;
      revealBanner.classList.remove('hidden');
      tickRevealCountdown();
      revealTimer = setInterval(tickRevealCountdown, 1000);
    }

    // Kickoff hit while someone is watching: flip the board over.
    function revealNow(){
      if (showPicks) return;
      showPicks = true;
      pendingRevealAnimation = true;
      const pointsMap = getPointsMapForCurrentView();
      renderTable(lastTeams, lastPickMap, winnerMap, showPicks, pointsMap, isPlayoffView);
      playRevealAnimation();
      status(`Kickoff! Picks are in for Season ${currentSeason} • Week ${currentWeek}.`);
    }

    // Ripple the flip across columns so the board turns over left to right,
    // the way a real one repaints.
    function playRevealAnimation(){
      if (!pendingRevealAnimation) return;
      pendingRevealAnimation = false;

      document.getElementById('jumbo-flashable')?.classList.remove('jumbo-flash');
      const jumbo = document.querySelector('.jumbotron-header');
      if (jumbo){
        jumbo.classList.remove('jumbo-flash');
        void jumbo.offsetWidth;          // restart the animation
        jumbo.classList.add('jumbo-flash');
      }

      tbody.querySelectorAll('tr').forEach(tr => {
        [...tr.children].forEach((td, col) => {
          if (col < 2) return;           // team + points columns don't flip
          td.classList.add('pick-revealing');
          td.style.animationDelay = ((col - 2) * 55) + 'ms';
        });
      });
    }

    // Live ticker
    // Polling is suspended while the tab is hidden so a forgotten background tab
    // doesn't keep hitting Supabase every 30s; it refreshes immediately on return.
    let liveTickerWanted = false;

    async function startLiveTicker(){
      liveTickerWanted = true;
      await refreshBadgesFromAllGames();
      resumeLiveTicker();
    }
    function stopLiveTicker(){
      liveTickerWanted = false;
      if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
    }
    // Anything not yet final and already past kickoff counts as in progress.
    // Restarts the interval only when the cadence actually changes.
    function applyLiveCadence(rows){
      const now = Date.now();
      const anyLive = (rows || []).some(r => {
        const st = String(r?.Status ?? '').toLowerCase();
        if (st === 'final') return false;
        if (st === 'in' || st === 'live' || r?.Period) return true;
        const ts = kickoffMs(r);
        return ts != null && now >= ts;
      });

      const next = anyLive ? LIVE_MS_ACTIVE : LIVE_MS_IDLE;
      if (next === liveIntervalMs) return;
      liveIntervalMs = next;
      if (liveTimer){ clearInterval(liveTimer); liveTimer = null; resumeLiveTicker(); }
    }

    function resumeLiveTicker(){
      if(!liveTickerWanted || liveTimer || document.hidden) return;
      liveTimer = setInterval(refreshBadgesFromAllGames, liveIntervalMs);
    }
    document.addEventListener('visibilitychange', () => {
      if(document.hidden){
        if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
      } else if(liveTickerWanted){
        refreshBadgesFromAllGames();
        resumeLiveTicker();
      }
    });

    async function refreshBadgesFromAllGames(){
      if(!gameIds || !gameIds.length) return;

      const { data: rows, error } = await supabase
        .from('all_games')
        .select('GameId, Status, AwayPts, HomePts, Period, Clock, "Start (CT)", Network, winner')
        .in('GameId', gameIds);

      if(error){
        console.warn('all_games refresh error:', error.message);
        return;
      }

      // Speed up while any game is running, slow right down when none is.
      applyLiveCadence(rows);

      let winnerChanged = false;

      (rows || []).forEach(r=>{
        const entry = headerStatusEls.get(String(r.GameId));
        if(!entry) return;

        const { awayScoreEl, homeScoreEl, centerEl } = entry;
        const aPts = r.AwayPts ?? '';
        const hPts = r.HomePts ?? '';

        // Update scores
        if (awayScoreEl) { awayScoreEl.textContent = (aPts !== '' && aPts != null) ? aPts : '–'; awayScoreEl.className = scoreClasses(r.Status, aPts, hPts, 'away'); }
        if (homeScoreEl) { homeScoreEl.textContent = (hPts !== '' && hPts != null) ? hPts : '–'; homeScoreEl.className = scoreClasses(r.Status, aPts, hPts, 'home'); }

        // Update center status
        if (centerEl) {
          centerEl.innerHTML = '';
          if (r.Status === 'final') {
            const f = document.createElement('div'); f.className = 'game-hdr-final'; f.textContent = 'FINAL'; centerEl.appendChild(f);
          } else if (r.Status === 'in_progress') {
            const p = r.Period || 1;
            const per = document.createElement('div'); per.className = 'game-hdr-period'; per.textContent = p >= 5 ? 'OT' : p + 'TH'; centerEl.appendChild(per);
            const clk = document.createElement('div'); clk.className = 'game-hdr-clock'; clk.textContent = r.Clock || ''; centerEl.appendChild(clk);
          } else {
            const t = document.createElement('div'); t.className = 'game-hdr-time'; t.textContent = formatTimeCentral(r['Start (CT)']) || 'TBD'; centerEl.appendChild(t);
          }
        }

        // Fold the fresh row back into the season cache, otherwise the points
        // recompute below would read stale winners.
        const cached = (seasonCache.games || []).find(g => Number(g.GameId) === Number(r.GameId));
        if (cached) Object.assign(cached, r);

        const prevWinner = winnerMap[r.GameId] ?? null;
        const currWinner = r.winner ?? null;
        if (prevWinner !== currWinner) {
          winnerMap[r.GameId] = currWinner;
          winnerChanged = true;
        }
      });

      let needRerender = false;

      // Regular weeks: global reveal when earliest kickoff hits
      if (!isPlayoffView && !showPicks && isWeekLocked(lastGames)) {
        showPicks = true;
        pendingRevealAnimation = true;
        stopRevealCountdown();
        status(`Kickoff! Picks are in for Season ${currentSeason} • Week ${currentWeek}.`);
        needRerender = true;
      }

      // Playoff: per-game gating
      if (isPlayoffView) {
        needRerender = true;
      }

      if (winnerChanged) {
        if (isPlayoffView) {
          await computePlayoffWins();
        } else {
          await computeSeasonWinsThroughWeek(currentWeek);
        }
        needRerender = true;
      }

      if (needRerender) {
        const pointsMap = getPointsMapForCurrentView();
        // Must match loadPlayoffWeek()'s ordering exactly. This re-sort runs from
        // the live ticker, which fires immediately on load - so dropping the seed
        // tiebreak here meant the seed-1 team was pushed below a tied seed-2 team
        // before the user ever saw the correct order.
        lastTeams.sort((a,b)=>{
          const pa = getPoints(pointsMap, a.team_id);
          const pb = getPoints(pointsMap, b.team_id);
          if (pb !== pa) return pb - pa;
          if (isPlayoffView) {
            const sa = a.seed ?? Infinity, sb = b.seed ?? Infinity;
            if (sa !== sb) return sa - sb;
          }
          return a.team_name.localeCompare(b.team_name);
        });

        renderTable(lastTeams, lastPickMap, winnerMap, showPicks, pointsMap, isPlayoffView);
        playRevealAnimation();
        await renderWeeklySubmissions(lastTeams, lastPickMap);
      }
    }

    // Scroll hint: hide fade when scrolled to end
    const scrollWrap = document.getElementById('table-scroll-wrap');
    if (scrollWrap) {
      scrollWrap.addEventListener('scroll', () => {
        const atEnd = scrollWrap.scrollLeft + scrollWrap.clientWidth >= scrollWrap.scrollWidth - 8;
        scrollWrap.classList.toggle('scrolled-end', atEnd);
      });
    }
  </script>
</body>
</html>
