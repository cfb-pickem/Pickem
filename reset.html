  <meta property="og:url" content="https://cfb-pickem.github.io/Pickem/reset.html"/>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@400;500;700&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/base.css">
  <link rel="modulepreload" href="./js/vendor/supabase.js">
  <link rel="modulepreload" href="./js/supabaseClient.js">
  <style>
    body{
      display:flex;justify-content:center;align-items:center;
    }
  </style>
  <!-- Tailwind: prebuilt (npm run css). Loads last so utilities win ties, matching the old CDN cascade. -->
  <link rel="stylesheet" href="./css/tailwind.css">
</head>

<body>
  <div class="max-w-md w-full p-6">
    <div class="cfp-card p-6 md:p-8">
      <h1 class="font-['Oswald',_sans-serif] text-3xl font-bold text-[var(--cfp-ivory)] text-center mb-4">Reset Password</h1>
      <p class="text-sm text-gray-300 text-center mb-6">Enter a new password for your account.</p>

      <form id="reset-form" class="space-y-4">
        <div>
          <label for="password" class="block text-sm font-medium text-gray-300">New Password</label>
          <input type="password" id="password" name="password" required minlength="6"
                 class="cfp-input mt-1 block w-full px-3 py-3 rounded-none text-sm"
                 placeholder="Enter new password">
        </div>
        <div>
          <label for="password2" class="block text-sm font-medium text-gray-300">Confirm Password</label>
          <input type="password" id="password2" name="password2" required minlength="6"
                 class="cfp-input mt-1 block w-full px-3 py-3 rounded-none text-sm"
                 placeholder="Re-enter new password">
        </div>
        <button type="submit" id="submit-btn"
                class="w-full px-4 py-3 bg-[var(--cfp-gold)] text-black font-semibold ring-gold">
          Update Password
        </button>
      </form>

      <div id="status" class="mt-4 text-sm text-center"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    // Also installs the view-transition AbortError guard; these pages redirect
    // mid-load, which cancels the inbound transition.
    import { initPrefetch } from './js/prefetch.js';
    initPrefetch();

    const form = document.getElementById('reset-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    function setStatus(msg, type='info'){
      const cls = type==='error'?'text-red-300':type==='success'?'text-green-300':'text-gray-300';
      statusEl.className = 'mt-4 text-sm text-center ' + cls;
      statusEl.textContent = msg;
    }

    async function init(){
      // Ensure Supabase recovery session is applied
      const { data: { session }, error } = await supabase.auth.getSession();
      if(!session){
        // Try to recover from the URL hash (#access_token, etc)
        const { error: recoverError } = await supabase.auth.exchangeCodeForSession(window.location.hash);
        if(recoverError){
          setStatus('Session could not be restored. Please re-open the password reset link.', 'error');
          form.style.display = 'none';
          return;
        }
      }
    }
    init();

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pw1 = form.password.value.trim();
      const pw2 = form.password2.value.trim();
      if(pw1 !== pw2){
        setStatus('Passwords do not match.', 'error');
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';
      try {
        const { data, error } = await supabase.auth.updateUser({ password: pw1 });
        if(error){
          setStatus(error.message || 'Failed to update password.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          return;
        }
        setStatus('Password updated! Redirecting to sign-in…', 'success');
        setTimeout(()=>window.location.href='./signin.html',1500);
      } catch (err) {
        setStatus('Unexpected error updating password.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
