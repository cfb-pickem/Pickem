# Picky style-only LoRA (Qwen3.5-9B MLX 4-bit, 16GB M4). Training data is private (data/).
model: /Users/Agent/picky-lora/base
train: true
fine_tune_type: lora
data: /Users/Agent/picky-lora/data/mlx
adapter_path: /Users/Agent/picky-lora/adapters
batch_size: 1
num_layers: 8
grad_checkpoint: true
max_seq_length: 384   # 512 peaked ~12 GB (Qwen3.5 linear-attn backward) and swapped; 384 ~10.3 GB
mask_prompt: true
iters: 808            # 2 epochs x 404 examples
learning_rate: 2.0e-5
steps_per_report: 10
steps_per_eval: 101   # 4x per epoch
val_batches: 44
save_every: 50
seed: 1115
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.05
